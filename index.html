 c:[{l:'Share the stage',h:'If the record is clean this costs nothing. If not, it costs money and you credit the co-creators.',f(){const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;if(fair){S.rep+=8;S.fans=clamp(S.fans+8,0,100);return'The room stands up for the old-timers.'}S.cash-=8*X();S.credits=true;S.rep+=4;S.flags.pension=1;loyAll(8);return'Your publisher calls the co-creators up from the audience. The checks and the credit lines follow.'}},
    {l:'Have security handle it',h:'',f(){const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;if(fair){S.rep-=2;return'There was nothing to handle. It looks odd.'}S.rep-=12;S.fans=clamp(S.fans-12,0,100);S.flags.exposed=1;return'The crowd is chanting his name as he is led out. It is in every fanzine by Monday.'}}]},
{y:1999,t:'The typed script',when:()=>S.flags.sold&&!!topHT(),x:()=>`Lawyers for ${S.lead.owner} have found that two retired artists may be owed payments for life as co-creators of ${hero(topHT().hero).name}. They ask your publisher emeritus to swear he created every hero alone. A typed script for the first issue would help, they say, and nobody needs to ask when it was typed.`,
 n:'Real history. Typed scripts and outlines have been offered as proof that one man created a hero alone, and historians still argue over when some of them were typed.',
 c:[{l:'Tell the lawyers the truth',h:'The stipends cost money. The record is straight.',f(){S.cash-=10*X();S.rep+=10;S.flags.honest=1;loyAll(8);return'The statement names both artists as co-creators. The owners are furious and the checks go out.'}},
    {l:'Sign the statement',h:'Saves the money.',f(){S.cash+=6*X();S.rep-=12;loyAll(-10);S.flags.perjury=1;return'The script is entered as evidence. Everyone who was there knows when it was typed.'}}]},

{y:1933,t:'Soap coupons',x:'The first comic booklets are not sold at all. A soap company mails them free to customers who send in coupons, and a five-and-dime chain has started stocking others. A soap maker asks whether you would print a giveaway for its brand.',
 n:'An eight-page promotional comic of 1933 was mailed free to customers who sent in coupons. A 36-page book of reprints went out through a department store chain the same year. Introduction.',
 c:[{l:'Print the giveaway',h:'A flat fee for three years.',f(){S.flags.premium=1935;S.cash+=2*X();return'The soap company pays on delivery, and the booklets go out by the sackful.'}},
    {l:'Newsstand only',h:'',f(){S.rep+=2;return'You would rather have readers who pay a dime.'}}]},
{y:1936,t:'The shop down the street',x:'A packaging shop has opened in a loft nearby. A dozen teenagers at drawing boards turn out complete comic books to order, signed with invented names, and the owner sells them by the page.',
 n:'Many early publishers bought finished comics from packaging shops, and several of the best Golden Age artists started in them. Chapters 10 and 13.',

    {l:'Hire two of the shop’s best',h:'Signing costs money.',f(){S.cash-=3*X();S.staff.push(newTalent('A',R(62,72)),newTalent('W',R(56,66)));return'Two of the teenagers bring their brushes over on Monday.'}},
    {l:'Pass',h:'',f(){return'You pass.'}}]},
{y:1946,t:'Comics for classrooms',x:'A church publisher wants a comic book of history and science stories to hand out in parochial schools every two weeks. It would never appear on a newsstand.',

    {l:'Decline',h:'',f(){return'You decline.'}}]},
{y:1948,t:'A cowboy star’s name',x:'Television has made stars of the movie cowboys. An agent offers the right to put his client’s name and photograph on a western comic.',
 n:'Comics with licensed material multiplied in 1948 as television grew. Introduction.',

    {l:'Too rich',h:'',f(){return'You pass.'}}]},
{y:1951,t:'Thirty-two pages',x:'Paper and printing cost more every year. Your comics are still 52 pages for a dime. The printer says everyone else is cutting to 32.',
 n:'Readers who once got 52 pages for 10 cents were getting 32 pages for the same price. Introduction.',

    {l:'Hold at 52 pages',h:'Overhead stays high through 1960. Readers approve.',f(){S.flags.bigbook=1960;S.rep+=4;return'“Still 52 pages for a dime” goes on every cover.'}}]},
{y:1961,t:'A letter from a fan',x:'A reader whose address ran on your letters page has heard from forty other readers. He is starting a mimeographed magazine about comics and asks for an interview and a list of your back issues.',

    {l:'Send a form letter',h:'',f(){return'The fanzine comes out anyway, with your form letter reprinted in it.'}}]},
{y:1964,t:'The first convention',x:'Fans are renting a hall in New York for a “comic art convention.” They have invited your editors and artists to speak.',

 c:[{l:'Send the whole bullpen',h:'A small cost. Fandom and loyalty rise.',f(){S.cash-=2*X();S.fans=clamp(S.fans+10,0,100);S.fan.cons=true;loyAll(4);S.rep+=3;return'About a hundred people come. Your artists sign their names for the first time in their lives.'}},
    {l:'It will never catch on',h:'',f(){return'About a hundred people come. None of yours.'}}]},
{y:1978,t:'The robot',when:()=>S.heroes.some(h=>h.recog>=40&&S.titles.some(t=>t.hero===h.id)),x:()=>{const h=S.heroes.filter(h=>S.titles.some(t=>t.hero===h.id)).sort((a,b)=>b.recog-a.recog)[0];return`A network wants a Saturday morning cartoon of ${h.name}. Years ago someone sold one supporting hero’s film and television rights to a different studio, so the network will replace him with a wisecracking robot.`},
 n:'A 1978 cartoon replaced one member of a famous team with a robot because that hero’s film and television rights were tied up elsewhere. Chapter 17.',
 c:[{l:'Take the robot',h:'Cash now. The fans will have opinions.',f(){S.cash+=12*X();S.fans=clamp(S.fans-6,0,100);S.flags.robot=1;return'The robot gets more fan mail than anyone expected, most of it angry.'}},
    {l:'Buy the rights back first',h:'Costs money. The whole cast appears.',f(){S.cash-=6*X();const h=S.heroes.slice().sort((a,b)=>b.recog-a.recog)[0];h.recog=clamp(h.recog+10,0,100);S.cash+=10*X();return'The cartoon runs with the full cast.'}}]},
{y:1980,t:'First printing rights only',x:'A new kind of contract is going around. The publisher buys only the right to print the work once, and the creators keep the copyright. Your editor wants an imprint built on it.',

 c:[{l:'Start the imprint',h:'Costs money. A prestige title, better applicants, a share of income to creators.',f(){S.cash-=6*X();S.flags.imprint=1;loyAll(10);const t=quickTitle('scifi',{qb:10});addShare({tid:t.id});return t.name+' is the first book you publish and do not own.'}},
    {l:'We own what we print',h:'',f(){loyAll(-5);return'The contract stays as it is.'}}]},

{y:1941,t:'The sales sheet',when:()=>!S.flags.share&&heroTitles().some(t=>tal(t.w)&&tal(t.a)),face:()=>{const t=topHT();return t&&tal(t.a)},x:()=>{const t=topHT();return`You promised ${tal(t.w).name} and ${tal(t.a).name} a cut of the profits on ${t.name}. The book is a hit. Your accountant points out that if the whole office’s overhead is charged to that one title, it shows no profit at all.`},
 n:'A publisher kept the real sales figures from the team behind his biggest hit. They went looking for a better deal, he found out and fired them, and a teenage relative in the office became the editor. Chapter 13.',
 c:[{l:'Pay what was promised',h:'Costs money. The team remembers.',f(){const t=topHT();S.cash-=4*X();[tal(t.w),tal(t.a)].forEach(p=>p.loy=clamp(p.loy+25,0,100));S.rep+=2;return'The checks are bigger than they expected.'}},
    {l:'Charge the overhead to their book',h:'Saves the money. They may find out.',f(){const t=topHT(),w=tal(t.w),a=tal(t.a);if(Math.random()<.65){leave(w);leave(a);const kid=newTalent('W',46,'M');kid.fresh=16;kid.left=40;S.staff.push(kid);t.w=kid.id;S.flags.kid=kid.id;S.rep-=3;return`They find the real figures and take a meeting with your biggest rival. You fire them both. ${kid.name}, the nineteen-year-old who fills the inkwells, is the only one left who knows the books. He is now the editor.`}return'Nobody checks the arithmetic.'}}]},
{y:1941,t:'A copy of your hero',when:()=>!S.flags.copycat&&S.heroes.some(h=>h.recog>=28&&S.titles.some(t=>t.hero===h.id)),x:()=>{const h=S.heroes.filter(h=>S.titles.some(t=>t.hero===h.id)).sort((a,b)=>b.recog-a.recog)[0];return`A rival has a new hero with the same powers as ${h.name} and a cape in a different color. This month the copy outsold the original.`},
 n:'The longest lawsuit of the Golden Age began in 1941 as a test case against a rival hero who was outselling the original. It ran until 1953. Chapters 5 and 8.',

    {l:'Send a cease-and-desist letter',h:'Cheap. It may be enough.',f(){S.cash-=X();if(Math.random()<.5){S.rep-=1;return'The rival drops the character after six issues.'}return'The rival’s lawyers send back a letter of their own.'}},
    {l:'Compete on the newsstand',h:'',f(){S.rep+=2;return'You tell the bullpen to make a better comic.'}}]},
{y:1943,t:'The signature',when:()=>!!best('A'),face:()=>best('A'),x:()=>`${best('A').name} has more work than one person can draw. The plan is to hire an assistant who pencils the pages in the same style. ${best('A').name.split(' ')[0]} will sign them.`,
 n:'Some of the best-known signatures in comics were on pages drawn by uncredited “ghost” artists. Chapters 3 and 12.',
 c:[{l:'Allow it',h:'An uncredited artist joins the bullpen.',f(){const g=newTalent('A',R(58,66));g.loy=42;g.ghost=1;S.staff.push(g);S.flags.ghost=g.id;return g.name+' takes the desk by the window and signs nothing.'}},
    {l:'Everybody signs their own work',h:'Creator credits are switched on.',f(){S.credits=true;loyAll(4,'A');return'The signature box gets a second line.'}}]},
{y:1947,t:'One issue',x:'A newspaperman has published a comic book written and drawn entirely by Black creators. It lasted one issue. He asks whether your company would put out a second.',
 n:'A 1947 comic book made entirely by Black creators lasted a single issue. Chapter 25.',
 c:[{l:'Publish it',h:'Costs money. Reputation rises and an artist joins you.',f(){S.cash-=4*X();S.rep+=8;const a=newTalent('A',R(66,76));S.staff.push(a);S.flags.oneIssue=1;return'The second issue comes out with your colophon. '+a.name+' stays on afterward.'}},
    {l:'Decline',h:'',f(){return'You wish him luck.'}}]},
{y:1953,t:'Twelve years in court',when:()=>S.flags.suit,x:'The copyright case you filed in 1941 is finally over. Hero comics barely sell now, and the rival has decided the fight is no longer worth the legal bills.',

 c:[{l:'Take the settlement',h:'',f(){S.cash+=18*X();S.rep-=2;return'The rival’s hero disappears from the stands. The check covers about half of what the lawyers cost.'}}]},
{y:1953,t:'The parody',when:()=>S.titles.some(t=>t.satire),x:'Your satire comic has run a story making fun of the most famous hero in comics and of the lawsuit his owners fought over him. Their lawyers have sent a letter threatening to sue.',

    {l:'Pull the story from reprints',h:'',f(){loyAll(-5,'W');return'The editor stops speaking to you for a month.'}}]},
{y:1954,t:'The witness chair',x:'The Senate subcommittee is taking testimony in New York next week. Most publishers are sending lawyers. You could go and speak for the business yourself.',
 n:'One publisher volunteered to testify in 1954 and had no good answer when asked to defend his covers. The others watched it on television. Chapter 11.',
 c:[{l:'Testify in person',h:'A gamble on live television.',f(){if(Math.random()<.45){S.rep+=9;return'You keep your temper and make the case for adult readers. The newspapers quote you fairly.'}S.rep-=10;return'A senator holds up one of your covers and asks whether it is in good taste. Nothing you say sounds right.'}},
    {l:'Send a written statement',h:'',f(){S.rep-=2;return'Your statement is entered into the record and nobody reads it.'}}]},
{y:1956,t:'The astronaut',when:()=>S.flags.code&&S.staff.length>1,x:'Your science fiction story ends with an astronaut taking off his helmet. He is a Black man. The Code’s administrator says the story cannot run unless he is redrawn.',
 n:'The original 1953 story about a Black astronaut is discussed in Chapter 25. The Code’s objection to reprinting it is real history that the book does not go into.',
 c:[{l:'Run it as drawn',h:'You threaten to tell the newspapers why.',f(){S.rep+=8;loyAll(5);return'The administrator backs down. The story runs without a line changed.'}},
    {l:'Redraw the last panel',h:'',f(){S.rep-=5;loyAll(-5);return'The artist does it and says nothing for a week.'}}]},
{y:1958,t:'A veteran at the door',x:'One of the best artists in the business has been blacklisted by a rival’s editor after a fight over the money from a newspaper strip. He turns up at your office the day the movers are carrying out the spare desks.',

    {l:'There is no work to give',h:'',f(){return'He takes his portfolio across town.'}}]},
{y:1960,t:'The golf game',x:'Your publisher is back from the golf course. A rival’s owner bragged between holes that his new comic about a team of heroes is the best seller he has.',
 n:'The story that one publisher learned of a rival’s hit during a round of golf has never been verified. The book says so. Chapter 14.',
 c:[{l:'Order a team book',h:'A hero title at half the usual cost.',f(){S.cash-=3*X();const t=quickTitle('hero',{origin:'science',qb:4});return t.name+' gets three partners and a headquarters.'}},
    {l:'It’s only a rumor',h:'',f(){return'You ask who won the round.'}}]},
{y:1965,t:'The silent partner',when:()=>S.flags.method&&!!topHT(),face:()=>tal(topHT().a),x:()=>{const t=topHT();return`${tal(t.w).name} and ${tal(t.a).name} no longer speak. The pages for ${t.name} arrive by messenger, fully plotted, and the writer adds the words. The artist wants the credit box to say who plots the book.`},
 n:'By the mid-1960s one artist was plotting a hit series alone and delivering pages without speaking to his editor. He left soon after. Chapter 17.',

    {l:'Leave the credits alone',h:'',f(){const t=topHT(),a=tal(t.a);leave(a);S.rep-=3;return a.name+' turns in the last pages and never explains why.'}}]},
{y:1967,t:'Benefits',x:()=>{const g=tal(S.flags.ghost);return g?`${g.name} has drawn under another artist’s signature for twenty-four years. Now he and some of the writers are asking for health insurance and a pension plan.`:'Some of your longest-serving writers and artists are asking for health insurance and a pension plan.'},
 n:'In 1968 a ghost artist and a veteran writer were let go from one of the big companies, possibly for asking for more benefits and health insurance. Chapter 12.',
 c:[{l:'Set up a plan',h:'Costs money every year. Loyalty rises.',f(){S.cash-=5*X();loyAll(12);S.rep+=4;S.flags.benefits=1;return'The insurance forms go around the bullpen.'}},
    {l:'Let the ringleaders go',h:'',f(){const g=tal(S.flags.ghost);if(g)leave(g);const w=S.staff.filter(t=>t.role==='W').sort((a,b)=>a.hired-b.hired)[0];if(w)leave(w);loyAll(-10);S.rep-=5;return'Two desks are empty on Monday.'}}]},
{y:1974,t:'Revenge, Incorporated',when:()=>S.flags.sold,x:'The founder’s family has started a new comics company across town. It pays better rates, returns original art and lets creators keep rights to what they invent. Your people are getting phone calls.',
 n:'A former owner launched a rival in 1974 with better rates, benefits, returned art and author rights. One artist called the mood “pure revenge.” Chapter 18.',
 c:[{l:'Match the terms',h:'Costs money. Page rates go to generous and art is returned.',f(){S.cash-=6*X();S.rate=2;S.flags.artReturn=1;loyAll(10);return'Nobody leaves. The new company folds within two years.'}},
    {l:'Let them call',h:'',f(){const out=S.staff.slice().sort((a,b)=>b.skill-a.skill).slice(0,2);out.forEach(leave);return out.length?out.map(o=>o.name).join(' and ')+' go across town. The new company folds within two years. They don’t come back.':'Nobody is left to poach.'}}]},
{y:1975,t:'The men who made him',when:()=>S.flags.flat&&!S.flags.pension&&hero(S.flags.flat.h),x:()=>`A movie of ${hero(S.flags.flat.h).name} has been announced. A newspaper has found the two people who created him. One works as a delivery man and is losing his eyesight. Well-known cartoonists are calling reporters on their behalf.`,
 n:'In 1975 two cartoonists ran a public campaign that won a hero’s creators their byline and a yearly pension. Chapter 10.',
 c:[{l:'A pension and their names on every story',h:'Costs money. Reputation rises.',f(){S.cash-=8*X();S.rep+=10;S.credits=true;S.flags.pension=1;loyAll(6);return'The announcement makes the evening news.'}},
    {l:'No comment',h:'',f(){S.rep-=12;loyAll(-8);return'The story runs for three weeks.'}}]},
{y:1987,t:'A familiar face',when:()=>S.staff.filter(t=>t.role==='W').length>0&&S.staff.filter(t=>t.role==='A').length>0,x:()=>`${best('W').name} has written a pompous new villain into this month’s story. Everybody in the office can see it is ${best('A').name}, who gave an interview last month that ${best('W').name.split(' ')[0]} didn’t like.`,
 n:'A writer once put a caricature of a star artist into a story after reading one of his interviews. The two later shook hands. Chapter 21.',
 c:[{l:'Make them shake hands',h:'',f(){loyAll(2);return'They shake hands at the Christmas party.'}},
    {l:'Print it. Feuds sell.',h:'Sales rise for two years. The artist won’t forget.',f(){mod(1.06,1988);const a=best('A');a.loy=clamp(a.loy-18,0,100);return'The fan press covers the feud for a year.'}}]},
{y:1988,t:'In print forever',when:()=>S.titles.some(t=>t.hero&&hero(t.hero).origin==='grim'&&tal(t.w)),x:()=>{const t=S.titles.find(t=>t.hero&&hero(t.hero).origin==='grim'&&tal(t.w));return`The contract for ${t.name} returns all rights to its creators when the book goes out of print. The collected edition has now been reprinted nine times. ${tal(t.w).name} says the contract was written so that day would never come.`},
 n:'The writer of the most praised series of the 1980s expected the rights to come back to him. The book never went out of print, and in 1989 he told the publisher he would never work for it again. Chapter 22.',
 c:[{l:'Give the rights back and license the book',h:'A share of that title’s income. Reputation rises.',f(){const tt=S.titles.find(t=>t.hero&&hero(t.hero).origin==='grim'&&tal(t.w));addShare(tt?{tid:tt.id,pct:.05}:{});S.rep+=10;loyAll(10);return'The creators own it now and you publish it. The writer stays.'}},
    {l:'A contract is a contract',h:'',f(){const t=S.titles.find(t=>t.hero&&hero(t.hero).origin==='grim'&&tal(t.w)),w=tal(t.w);leave(w);S.rep-=8;loyAll(-6);return w.name+' sends a one-line letter and never works for you again.'}}]},

{y:1934,t:'The syndicate’s offer',when:()=>S.titles.some(t=>t.reprint),x:'A newspaper syndicate will sell you the comic book rights to one of its most popular strips. The contract runs to nine pages and covers toys, games and candy wrappers too.',
 n:'Strip creators and their publishers worked out copyright, licensing and merchandising decades before comic books existed. Chapter 1.',
 c:[{l:'Buy the license',h:'Costs money. Your reprint title gets better strips.',f(){S.cash-=4*X();S.titles.filter(t=>t.reprint).forEach(t=>t.qb=12);return'A famous strip now leads off every issue.'}},
    {l:'Keep the cheap strips',h:'',f(){return'You stay with the strips nobody else wanted.'}}]},
{y:1939,t:'The contract',when:()=>heroTitles().some(t=>tal(t.w)&&tal(t.a)),x:()=>{const t=heroTitles().filter(t=>tal(t.w)&&tal(t.a)).sort((a,b)=>hero(b.hero).recog-hero(a.hero).recog)[0];return`${tal(t.w).name} and ${tal(t.a).name} created ${hero(t.hero).name}. Your lawyer has drawn up a release that buys every right to the character for one check.`},
 n:'The young creators of the first great hero signed away their rights early. Their long, unhappy exit from comics began with that contract. Chapter 10.',
 c:[{l:'Have them sign the release',h:'Cheap now. The hero is yours outright.',f(){const t=heroTitles().filter(t=>tal(t.w)&&tal(t.a)).sort((a,b)=>hero(b.hero).recog-hero(a.hero).recog)[0];S.cash-=2*X();S.flags.flat={h:t.hero,w:t.w,a:t.a};return'They sign on the back of the check.'}},
    {l:'Give them a share',h:'Two percent of that hero’s sales from now on. They stay loyal.',f(){const t=heroTitles().filter(t=>tal(t.w)&&tal(t.a)).sort((a,b)=>hero(b.hero).recog-hero(a.hero).recog)[0];addShare({hid:t.hero});[tal(t.w),tal(t.a)].forEach(p=>p.loy=clamp(p.loy+30,0,100));S.rep+=3;return'They frame the contract.'}}]},
{y:1945,t:'The men come home',when:()=>S.flags.women&&S.staff.some(t=>t.g==='F'),x:'The war is over and your old artists are back from the service. They expect their desks. The women who kept the line going are sitting at them.',
 n:'When the men returned around 1945 they wanted their old jobs, and most of the women who had drawn the wartime comics were pushed out. Chapter 24.',
 c:[{l:'Keep everyone',h:'Costs money for more desks. Reputation and loyalty rise.',f(){S.cash-=3*X();S.rep+=4;S.staff.forEach(t=>{if(t.g==='F')t.loy=clamp(t.loy+15,0,100)});S.flags.keptWomen=1;return'You rent the floor upstairs.'}},
    {l:'Give the veterans their desks',h:'The wartime hires leave. Two veterans return.',f(){S.staff.filter(t=>t.g==='F'&&t.hired>=1942).forEach(leave);S.staff.push(newTalent('A',R(58,70),'M'),newTalent('A',R(55,66),'M'));S.rep-=3;return'The women clear out their drawers by Friday.'}}]},
{y:1947,t:'They want their hero back',when:()=>S.flags.flat&&hero(S.flags.flat.h),x:()=>`The creators of ${hero(S.flags.flat.h).name} have hired a lawyer. They say the release they signed in 1939 was unfair and they want the character returned.`,
 n:'The first hero’s creators sued for their character in 1947 and lost their jobs over it. Chapter 10.',
 c:[{l:'Settle with a pension and a credit line',h:'Costs money. Reputation rises.',f(){S.cash-=8*X();S.rep+=6;S.credits=true;S.flags.pension=1;return'Their names go on the first page of every story.'}},
    {l:'Fight them and let them go',h:'You will win. The bullpen will remember.',f(){[S.flags.flat.w,S.flags.flat.a].map(tal).filter(Boolean).forEach(leave);S.rep-=8;loyAll(-8);S.flags.firedCreators=1;return'The court sides with the contract. Their names come off the strip.'}}]},
{y:1952,t:'Humor in a jugular vein',x:'One of your editors wants a humor comic that makes fun of everything, including advertising, television and other comic books.',

 c:[{l:'Give it a tryout',h:'A humor title at no cost, with a quality bonus.',f(){const t=quickTitle('humor',{qb:10});t.satire=1;return t.name+' sells slowly at first. Then the college kids find it.'}},
    {l:'Too risky',h:'',f(){return'You pass.'}}]},
{y:1955,t:'Out from under the Code',when:()=>S.flags.code&&S.titles.some(t=>t.satire&&!t.magazine),x:'The Code has taken the teeth out of your satire comic. The editor says a 25-cent magazine with no seal would answer to nobody.',
 n:'The move to magazine format saved one satire title. The same publisher’s picture-story magazines for adults failed within a year. Chapter 11.',
 c:[{l:'Make it a magazine',h:'Costs money. Higher price, no Code.',f(){const t=S.titles.find(t=>t.satire);t.magazine=true;S.cash-=6*X();return t.name+' comes back in black and white at more than twice the price.'}},
    {l:'Keep it a comic',h:'The jokes get safer.',f(){const t=S.titles.find(t=>t.satire);t.qb=(t.qb||0)-8;return'The seal goes on the cover and the bite goes out of it.'}}]},
{y:1958,t:'Giant monsters',x:'Drive-in movies are full of creatures from space and things that crawl out of the sea. Your artist has a stack of monster designs and names for all of them.',
 n:'Monster comics filled the late 1950s. Their creatures and even their names were reused a few years later for flawed heroes. Chapter 15.',
 c:[{l:'Start a monster title',h:'A science fiction title at no cost, with a quality bonus.',f(){const t=quickTitle('scifi',{qb:8});return t.name+' has something forty feet tall on every cover.'}},
    {l:'Pass',h:'',f(){return'You pass.'}}]},
{y:1964,t:'Names in the drawer',when:()=>S.heroes.some(h=>!h.lost&&!S.titles.some(t=>t.hero===h.id)),x:'Your lawyer has a list of heroes you no longer publish. A trademark that isn’t used can be lost, and a rival has already put one forgotten name on a new character.',

 c:[{l:'Sell the license',h:'Cash now and a small fee per film. The studio keeps the profit.',f(){S.cash+=14*X();S.film=S.film||{};S.film.lic=1;return'You cash the check. The studio’s contract runs to ninety pages and defines profit on page sixty-one.'}},
    {l:'Hold the rights',h:'Nothing now. You may want them later.',f(){S.film=S.film||{};return'The studio buys a rival’s hero and you keep yours.'}}]},
{y:2002,t:'The free one',x:'A shop owner in California proposes that every comics shop in the country give away comic books on the first Saturday in May, the day after a big hero film opens. Publishers would print the giveaways at cost.',
 n:'Real history. The first national free comic book giveaway day was held on May 4, 2002. More than two thousand shops took part and gave away over two million comics.',
 c:[{l:'Print a giveaway',h:'A small cost. Fandom rises and shops sell more for two years.',f(){S.cash-=2*X();S.fans=clamp(S.fans+5,0,100);mod(1.06,2004);return'There is a line outside the shops before they open. Some of the children have never been inside one.'}},
    {l:'Sit it out',h:'',f(){return'Your rivals’ giveaways are gone by noon.'}}]},
{y:2002,t:'Right to left',x:'A small publisher has stopped flipping the pages of Japanese comics. Its books read right to left, cost ten dollars, and sell in mall bookstores to girls who have never bought a monthly comic. Your sales manager wants a line of your own.',
 n:'Real history. In 2002 one publisher began printing translated manga unflipped, which was faster and cheaper. It held nearly half the American manga market by 2004, and a single bookstore chain sold about four in ten of all manga volumes.',
 c:[{l:'License a Japanese series',h:'Costs money. Opens a manga title and a bookstore sales rep.',f(){S.cash-=7*X();if(S.ch&&S.ch.book<1)S.ch.book=1;if(S.titles.length<titleCap()){const tt=quickTitle('manga',{qb:6});return tt.name+' goes on sale in bookstores, back cover first.'}return'You sign the license. There is no room on the schedule until a title is cancelled.'}},
    {l:'Leave it to the bookstores',h:'',f(){return'Teenagers sit on the floor of the bookstore reading somebody else’s books.'}}]},
{y:2003,t:'Forty-eight late books',x:'A retailer has counted forty-eight of your titles that shipped late or with a different writer or artist from the one in the catalog. Shops cannot return what they ordered. He has filed a class action.',
 n:'Real history. A comics retailer sued a major publisher in 2002 over late and changed books. The claim went to arbitration and was settled in 2003, and shops received credits about three and a half years after the suit was filed.',
 c:[{l:'Settle with credits and make late books returnable',h:'Costs money. Shops trust your catalog again.',f(){S.cash-=5*X();S.rep+=4;mod(1.04,2006);return'Every shop gets a credit on its account, and your editors get a calendar.'}},
    {l:'Fight it',h:'',f(){S.cash-=2*X();if(Math.random()<.5){S.rep-=4;S.cash-=6*X();return'The arbitrator reads your own catalog back to you.'}S.rep-=1;return'The case drags on until the retailer’s lawyers lose interest.'}}]},
{y:2003,t:'Ten percent of nothing',when:()=>!!(S.film&&S.film.lic),x:()=>`${bw('W').name}’s contract promises him ten percent of your profit from films. The studio’s film of ${topH().name} has earned a fortune at the box office, and the studio reports that it has not yet made a profit. A television news program has asked him how that feels.`,
 n:'Real history. A company’s best-known editor was promised ten percent of film profits in 1998. In 2002 he was told a record-breaking film had produced none, and he sued. A judge ruled largely in his favor in 2005 and the parties settled.',
 c:[{l:'Pay him from your license income',h:'Costs money. The staff notices.',f(){S.cash-=8*X();const w=bw('W');w.loy=clamp(w.loy+20,0,100);loyAll(4);S.rep+=3;return'He calls it the friendliest settlement in history and goes back to the convention circuit.'}},
    {l:'Tell him the contract says profit',h:'He may sue, and reporters like him.',f(){const w=bw('W');w.loy=clamp(w.loy-25,0,100);if(Math.random()<.6){S.cash-=14*X();S.rep-=5;return'He sues, smiling, on the evening news. A judge reads the word “profit” the way he does.'}S.rep-=3;return'He decides not to sue the company that prints his name. He says so on television.'}}]},
{y:2004,t:'Salaries in Florida',when:()=>!!best('A'),x:()=>`A software millionaire has opened a comics company in Florida. He pays artists a salary with health insurance and seats them in one studio. ${bw('A').name} has been offered a desk.`,
 n:'Real history. A publisher founded in Florida in 1998 kept its writers and artists on staff. It filed for bankruptcy in June 2004 and its titles stopped in the middle of their stories.',
 c:[{l:'Match the salary and the insurance',h:'Costs money each year. Your artists stay.',f(){S.cash-=4*X();S.flags.benefits=S.flags.benefits||1;loyAll(10,'A');return'Your artist stays. By summer the Florida company has stopped paying its printer.'}},
    {l:'Let him go and see',h:'',f(){const a=bw('A');a.loy=clamp(a.loy-10,0,100);return a.name+' flies down for a look. The company files for bankruptcy in June and he comes home with a story.'}}]},
{y:2004,t:'Lookalikes',when:()=>S.heroes.some(h=>!h.lost),x:()=>`An online game lets each player design a hero. Thousands of them have built ${topH().name} with the colors changed. Your lawyers want to sue the game’s makers for helping them do it.`,
 n:'Real history. A publisher sued the makers of an online hero game in 2004. The judge threw out screenshots of lookalike characters that the publisher’s own people had created inside the game, and the case was settled.',
 c:[{l:'Sue',h:'Costs money. Players are also readers.',f(){S.cash-=5*X();S.fans=clamp(S.fans-4,0,100);if(Math.random()<.35){S.cash+=6*X();return'The game adds a filter for your heroes’ names and pays a quiet settlement.'}S.rep-=3;return'The judge learns that your own paralegals built half the examples. The case is settled for nothing.'}},
    {l:'License your heroes to a game of your own',h:'',f(){S.cash+=3*X();S.fans=clamp(S.fans+2,0,100);return'A studio pays for the real thing.'}},
    {l:'Let them play',h:'',f(){S.fans=clamp(S.fans+2,0,100);return'The lookalikes keep fighting crime.'}}]},
{y:2004,t:'Before the premiere',when:()=>S.heroes.length>0,x:()=>`An artist who designed half the cast of your best-selling team is in a veterans’ hospital and cannot pay for it. A film of the team opens in three weeks. Other artists are auctioning drawings for him, and a reporter has called.`,
 n:'Real history. In 2004 fellow artists raised money for a hospitalized artist who had co-created a film franchise’s characters and received nothing from the films. The publisher then agreed to pay him.',
 c:[{l:'Pay his bills and a pension',h:'Costs money. Creators remember.',f(){S.cash-=5*X();S.flags.sickPaid=1;loyAll(10);S.rep+=5;return'The agreement is signed in his hospital room. He asks that the terms stay private.'}},
    {l:'Send flowers',h:'',f(){loyAll(-10);S.rep-=6;return'The auction makes the newspapers the same week as the premiere.'}}]},
{y:2005,t:'Ten heroes for collateral',when:()=>S.heroes.length>0,x:'A bank will lend you half a billion dollars over seven years to make your own films, with no studio taking a cut. The security is the film rights to ten of your heroes. If the films fail, the bank keeps them.',
 n:'Real history. In 2005 a publisher borrowed 525 million dollars for seven years to make its own films and pledged the film rights to ten characters. Its first self-made film opened in 2008, and an entertainment giant bought the company the following year.',
 c:[{l:'Take the loan',h:'Your own films from 2008, every two years. The loan comes due in 2012.',f(){S.film=S.film||{};S.film.own=1;S.film.debt=Math.round(55*X());S.film.due=2012;return'You sign. Ten heroes are now listed in a bank’s vault as security.'}},
    {l:'Stay a publisher',h:'',f(){return'The bank takes its money to a rival.'}}]},
{y:2007,t:'The scanners',x:'Every comic you publish is scanned and posted online by Wednesday night. A startup offers to sell your comics legally on screens, one panel at a time, and your sales manager wants a subscription library of back issues.',
 n:'Real history. A digital comics store was founded in 2007, and one large publisher opened a subscription library of its back issues the same year.',
 c:[{l:'Open the back issues online',h:'Costs money. A first step into digital.',f(){S.cash-=5*X();if(S.ch&&S.ch.digital<1)S.ch.digital=1;S.fans=clamp(S.fans+3,0,100);return'Sixty years of back issues go behind a monthly fee.'}},
    {l:'Send takedown letters',h:'',f(){S.cash-=1*X();S.fans=clamp(S.fans-3,0,100);return'The scans move to another address by Thursday.'}}]},
{y:2007,t:'A hero from 1972',when:()=>S.heroes.length>0,x:()=>`A film of one of your supernatural heroes has opened. The writer of the first story says he thought up the character before he ever brought it to your office, and that the copyright came back to him when it was time to renew.`,
 n:'Real history. A writer sued in 2007 over a hero first published in 1972. He lost in 2011, won on appeal in 2013 because a later contract did not clearly cover the renewal term, and the case was settled.',
 c:[{l:'Settle and credit him',h:'Costs money.',f(){S.cash-=6*X();loyAll(6,'W');S.rep+=3;return'His name goes on the first page of every issue.'}},
    {l:'Fight it',h:'Your paperwork decides it.',f(){const p=.35+(S.flags.paper?.2:0)+(S.flags.wfh?.2:0)+(S.renew?.1:0);if(Math.random()<p){S.cash-=3*X();S.rep-=4;return'The court finds your releases cover it. Fans read that he is selling sketches to pay his lawyers.'}S.cash-=14*X();S.rep-=3;return'An appeals court finds the old contract says nothing clear about renewals. You settle on the courthouse steps.'}}]},
{y:2008,t:'The school book fair',x:'A children’s publisher is selling book-length comics for eight-to-twelve-year-olds at school book fairs. Its lead title has sold more copies than your whole line of hero monthlies. Your shops do not stock anything like it.',
 n:'Real history. Graphic novels for young readers, sold through bookstores, libraries and schools, grew through the 2010s. By 2019 most of the comics market’s record sales came from graphic novels, and children’s titles led them.',
 c:[{l:'Start a line for young readers',h:'Costs money. Opens a kids’ title and the bookstore program.',f(){S.cash-=8*X();if(S.ch)S.ch.book=Math.min(3,S.ch.book+1);if(S.titles.length<titleCap()){const tt=quickTitle('kids',{qb:6});return tt.name+' is in four thousand school gyms by October.'}return'The line is ready. There is no room on the schedule until a title is cancelled.'}},
    {l:'Our readers are thirty-five',h:'',f(){return'The children’s publisher prints another million copies.'}}]},
{y:2009,t:'Four billion dollars',x:()=>S.flags.sold?`${S.lead.owner} has agreed to sell your company to Larkspur Entertainment, the family entertainment giant, as part of a four-billion-dollar deal. You find out from a news alert.`:`Larkspur Entertainment, the family entertainment giant, wants to buy ${S.co}. The offer is ${money(140*X())}. It says it is buying five thousand characters.`,
 n:'Real history. In 2009 an entertainment company agreed to pay about four billion dollars for a comics publisher and spoke of a library of more than five thousand characters. Staff in the licensing office learned of it by email.',
 c:[{l:()=>S.flags.sold?'Meet the new owners':'Sell',h:'',f(){if(S.flags.sold){sellTo('Larkspur Entertainment',['licensing','finance']);S.cash+=10*X();return'The new owner sends a welcome basket and a list of approved fonts.'}S.cash+=140*X();sellTo('Larkspur Entertainment',['licensing','finance']);return'You sign in a boardroom with cartoon cels on the walls. A quarter of every future profit goes upstairs.'}},
    {l:()=>S.flags.sold?'Ask for the same terms as before':'Stay independent',h:'',f(){if(S.flags.sold){sellTo('Larkspur Entertainment',['licensing','finance']);return'The answer comes on new letterhead. The terms are the same.'}S.rep+=4;loyAll(4);return'You keep the company. The giant buys your biggest rival’s licensee.'}}]},
{y:2009,t:'Forty-five notices',when:()=>S.heroes.length>0,x:()=>`The children of the artist who drew your heroes in the 1960s have served forty-five notices of termination. Under the copyright law they can take back what their father granted, unless he was working for hire. They are asking for his share of ${heirHeroes()[0].name} and the rest.${lostLine(heirHeroes().find(h=>h.lost))}`,
 n:'Real history. In 2009 an artist’s heirs served 45 termination notices on a publisher. The courts ruled in 2011 and 2013 that the work had been made for hire. Neither side could produce a single check from the years the characters were created.',
 c:[{l:'Settle with the family',h:'Costs money. Their father’s name goes on the credits.',f(){S.cash-=18*X();S.flags.heirsPaid=1;S.flags.estate='paid';S.rep+=6;loyAll(8);return'The settlement is private. The credit line is not.'}},
    {l:'Ask a court to declare the work made for hire',h:'Your old paperwork decides it.',f(){const p=clamp(.3+(S.flags.paper?.2:0)+(S.flags.wfh?.15:0)+(S.checks?.1:0)+(S.flags.affidavit?.1:0)+(S.law.retainer?.05:0),.15,.9);S.cash-=6*X();if(Math.random()<p){S.flags.estate='won';S.rep-=4;S.fans=clamp(S.fans-3,0,100);return'The judge says the case is not about who the real creator was, or about fairness. The heroes are yours. The family appeals.'}S.flags.estate='lost';S.cash-=30*X();heirHeroes().forEach(h=>addShare({hid:h.id}));S.rep-=2;return'You cannot produce one check or contract from the years the heroes were created. The court gives the family a share.'}}]},
{y:2011,t:'A third of the market',when:()=>!!(S.ch&&S.ch.book>0)||S.titles.some(x=>x.genre==='manga'),x:'The bookstore chain that sells four out of ten manga volumes in the country has filed for bankruptcy and is closing two hundred stores. It owes you for a year of books, and the liquidators are selling your stock at seventy percent off.',
 n:'Real history. A national bookstore chain filed for bankruptcy in February 2011 and was liquidated. A manga publisher that did about a third of its business with the chain, and was owed money by it, closed its American office that spring.',
 c:[{l:'Write off the debt',h:'A loss now.',f(){const d=(4+4*(S.ch?S.ch.book:0)+3*S.titles.filter(x=>x.genre==='manga').length)*X();S.cash-=d;mod(.85,2013,{genre:'manga'});return'You lose '+money(d)+'. Manga sales fall for two years while readers find another store.'}},
    {l:'Join the creditors’ committee',h:'Legal fees, and maybe some of it back.',f(){const d=(4+4*(S.ch?S.ch.book:0)+3*S.titles.filter(x=>x.genre==='manga').length)*X();S.cash-=d+1*X();mod(.85,2013,{genre:'manga'});if(Math.random()<.4){S.cash+=d*.3;return'After two years of hearings you recover about thirty cents on the dollar.'}return'The lawyers are paid first. There is nothing left when your turn comes.'}}]},
{y:2011,t:'Fifty-two first issues',when:()=>heroTitles().length>0,x:'Your publisher proposes cancelling every hero title in August and starting each one again at number one in September, with younger heroes and new costumes. Every issue would go on sale on phones the same day it reaches the shops.',
 n:'Real history. In September 2011 a publisher cancelled its entire hero line and launched 52 new first issues, sold digitally the same day as in print. The lead title’s first printing passed 200,000 copies and all 52 sold out.',
 c:[{l:'Relaunch the line, same day on phones',h:'A big lift for two years. Shops worry about the phones.',f(){mod(1.3,2013,{genre:'hero'});if(S.ch&&S.ch.digital<2)S.ch.digital=2;S.flags.relaunch=(S.flags.relaunch||0)+1;S.rep+=2;return'Every first issue sells out and goes back to press. The shops find that the phones did not take their customers.'}},
    {l:'Relaunch in print only',h:'A smaller lift.',f(){mod(1.2,2013,{genre:'hero'});S.flags.relaunch=(S.flags.relaunch||0)+1;return'The first issues sell out. The scans are online by Wednesday night anyway.'}},
    {l:'Keep the numbering',h:'Longtime readers approve.',f(){S.rep+=3;S.fans=clamp(S.fans+2,0,100);return'Issue 900 comes out on schedule.'}}]},
{y:2012,t:'Sunday night television',when:()=>!!best('W'),x:()=>`A black-and-white comic about the end of the world, owned by the two men who make it, has become the most-watched show on cable. They keep the money. ${bw('W').name} would like the same deal for the next idea.`,
 n:'Real history. In the 2010s comics owned by their creators became television series, and writers who had made their names on company heroes moved to publishers that let them keep their rights.',
 c:[{l:'Open a creator-owned imprint',h:'Costs money. You publish it, they own it, you share the income.',f(){S.cash-=5*X();S.flags.imprint=1;loyAll(12);S.rep+=4;if(S.titles.length<titleCap()){const tt=quickTitle(pick(['horror','scifi','crime','fantasy']),{qb:10});return tt.name+' is the imprint’s first book. A producer options it before the second issue.'}return'The imprint has a logo and a waiting list.'}},
    {l:'Everything made here stays here',h:'Your best writer may leave.',f(){const w=bw('W');w.loy=clamp(w.loy-25,0,100);loyAll(-6,'W');return w.name+' takes the idea across town.'}}]},
{y:2014,t:'Days before the conference',when:()=>S.flags.estate==='won',x:'The artist’s family has asked the highest court in the country to hear its appeal. Three unions of actors, directors and writers have filed in support. The justices meet to discuss the petition on Friday, and a ruling against you would reach every hero made the same way.',
 n:'Real history. In 2014 a publisher settled with an artist’s heirs a few days before the Supreme Court was to consider their petition. The terms were confidential.',
 c:[{l:'Settle before Friday',h:'Costs money. The question is never answered.',f(){S.cash-=14*X();S.flags.heirsPaid=1;S.flags.estate='paid';S.rep+=4;loyAll(5);return'A joint statement says the dispute has been resolved amicably. Nobody says for how much.'}},
    {l:'Let the justices decide',h:'One chance in four of losing everything made that way.',f(){if(Math.random()<.25){S.cash-=60*X();S.flags.estate='lost';heirHeroes().forEach(h=>addShare({hid:h.id}));return'The court takes the case, and a year later rewrites the rule for work made for hire. Every family from the 1960s has a lawyer by morning.'}S.rep-=3;return'The court declines to hear it. The family’s lawyer says other families are watching.'}}]},
{y:2014,t:'The exclusive',x:'The digital store that sells most comics on phones has been bought by the largest online retailer in the world. It offers you a large advance to sell your digital comics nowhere else.',
 n:'Real history. The leading digital comics store was bought by a large online retailer in 2014. Its separate app and storefront were later folded into the parent’s, and readers complained that their libraries became hard to use.',
 c:[{l:'Take the advance',h:'Cash now. Your digital readers live in someone else’s store.',f(){S.cash+=10*X();S.flags.exclusive=1;if(S.ch&&S.ch.digital<1)S.ch.digital=1;return'The advance arrives. So does a new set of terms, by email, with no room for a signature.'}},
    {l:'Sell everywhere, and from your own site',h:'Costs money.',f(){S.cash-=3*X();if(S.ch&&S.ch.digital<2)S.ch.digital=2;return'You build your own storefront. It is slow, and you keep every sale.'}}]},
{y:2015,t:'A new name under the mask',when:()=>heroTitles().length>0,x:()=>`Your editors want to hand ${topH().name}’s name and costume to a new, younger character from a different background, and send the original off on a long journey. They say bookstores, libraries and new readers will respond. Some longtime readers and shop owners already have, by letter.`,
 n:'Real history. In the mid-2010s publishers gave several famous hero names to new and younger characters. Some of those books found new readers in bookstores and libraries, and some shop owners reported that monthly sales fell.',
 c:[{l:'Pass the mantle',h:'Bookstore and library sales rise. Some monthly readers leave.',f(){const h=topH();S.fans=clamp(S.fans+2,0,100);S.rep+=3;const tt=S.titles.find(x=>x.hero===h.id);if(tt){mod(S.ch&&S.ch.book>=1?1.15:.92,2018,{title:tt.id})}return S.ch&&S.ch.book>=1?'The collected edition is checked out of every library that owns it.':'The shops order fewer copies, and you have no bookstore program to make up the difference.'}},
    {l:'Give the new character a title of their own',h:'Needs room on the schedule.',f(){if(S.titles.length<titleCap()){const o=ORIG.science?'science':undefined;const tt=quickTitle('hero',{origin:o,qb:6,recog:14});hero(tt.hero).skin=pick([1,2,3,4]);S.rep+=3;return tt.name+' starts at issue one with a hero nobody has to give anything up for.'}return'There is no room on the schedule.'}},
    {l:'Leave things as they are',h:'',f(){return'The original keeps the mask.'}}]},
{y:2018,t:'One hundred pages at the big-box store',x:'The largest retailer in the country will give you a rack near the checkout in three thousand stores, for hundred-page comics at five dollars. Comics shops hear about it from the press release.',
 n:'Real history. In 2018 a publisher began selling exclusive 100-page comics in a national discount chain, the first large effort in decades to sell comics outside specialty shops and bookstores.',
 c:[{l:'Fill the racks',h:'New readers. The shops want the same books.',f(){S.cash+=6*X();S.fans=clamp(S.fans+4,0,100);S.rep-=2;return'Parents buy them with the groceries. The shops get the same stories four months later.'}},
    {l:'Offer the shops the same books the same day',h:'Less money, no hard feelings.',f(){S.cash+=3*X();S.fans=clamp(S.fans+3,0,100);S.rep+=2;return'The big-box buyer grumbles and signs anyway.'}},
    {l:'Stay in the shops',h:'',f(){S.rep+=1;return'The rack near the checkout goes to gift cards.'}}]},
{y:2020,t:'Seven weeks',x:'A virus has closed the shops. The one distributor that serves every comics shop in the country has stopped shipping and says it will pay its publishers late. Your warehouse is full of comics nobody can deliver.',
 n:'Real history. On March 23, 2020 the sole distributor to comics shops suspended shipments for about seven weeks. In April one of the two largest publishers set up two new distributors, run by large retailers, and in June it left the old distributor for good.',
 c:[{l:'Set up your own distribution with two big retailers',h:'Costs money. You are never again in one company’s hands.',f(){S.cash-=8*X();S.flags.newDist=1;mod(.9,2020);S.rep-=2;return'Your books ship on Tuesdays from a mail-order warehouse. The old distributor’s owner stops returning your calls.'}},
    {l:'Wait for the trucks',h:'Two lost months.',f(){mod(.72,2020);return'You publish nothing for seven weeks. The payments owed to you arrive on a schedule nobody agreed to.'}},
    {l:'Sell on phones until the shops reopen',h:'Some income. The shops remember.',f(){mod(.82,2020);if(S.ch&&S.ch.digital<1)S.ch.digital=1;S.rep-=4;return'Readers get their comics. The shops that kept the lights on by mail order feel abandoned.'}}]},
{y:2021,t:'The book-trade giant',when:()=>!S.flags.newDist,x:'One of the largest book publishers in the world offers to distribute your comics to the shops, with free shipping for retailers. The old distributor, which has had your business for twenty-five years, would become a middleman.',
 n:'Real history. In March 2021 the largest comics publisher moved its distribution to a major book publisher’s services arm. Other publishers followed, and by 2023 the old distributor had lost most of its periodical business.',
 c:[{l:'Move to the book-trade giant',h:'Better terms. The old distributor is weaker without you.',f(){S.flags.newDist=1;S.cash+=3*X();mod(1.04,2024);return'The first shipments arrive in boxes built for hardcovers, with the corners bent. They get better at it.'}},
    {l:'Stay with the old distributor',h:'Loyalty. All your stock sits in its warehouse.',f(){S.rep+=2;return'The owner sends a signed thank-you note.'}}]},
{y:2021,t:'Five thousand dollars and a ticket',when:()=>!!(S.film&&(S.film.own||S.film.lic)),x:'A newspaper reports what your company sends a writer or artist when a film uses a character of theirs: a check for five thousand dollars and an invitation to the premiere. One writer says the actor had to get him into the party.',
 n:'Real history. A 2021 newspaper report found that a film’s use of a character typically brought its comics creators $5,000 and a premiere invitation. A few held “special character contracts” that paid more, and some said those were not honored in full.',
 c:[{l:'Give every creator a character contract',h:'Five percent of film income from now on. Loyalty and reputation rise.',f(){S.flags.equity=1;loyAll(15);S.rep+=6;return'The contracts go out to everyone who created a character that reached the screen. The first payments surprise the people who get them.'}},
    {l:'The check is generous for work made for hire',h:'',f(){S.flags.fiveK=1;loyAll(-12);S.rep-=6;return'The story runs for a week. Your writers start newsletters.'}}]},
{y:2021,t:'The newsletter',when:()=>!!best('W'),x:()=>`A newsletter company is paying comics writers six-figure grants to publish their own comics by email. The writers keep everything they make. ${bw('W').name} writes your best-selling hero and has been offered one.`,
 n:'Real history. In August 2021 a newsletter platform offered well-known comics writers grants to publish creator-owned work, and some left top hero titles to accept. Crowdfunding had already raised more than 18 million dollars for comics projects that year.',
 c:[{l:'Match it with a creator-owned deal',h:'Costs money.',f(){S.cash-=6*X();S.flags.imprint=1;const w=bw('W');w.loy=clamp(w.loy+20,0,100);return w.name+' stays on the hero and starts a book of his own under your imprint.'}},
    {l:'Wish him luck',h:'Your best writer goes.',f(){const w=bw('W');w.loy=clamp(w.loy-30,0,100);mod(.93,2023,{genre:'hero'});return w.name+' leaves the book in the middle of a story. His first newsletter goes to forty thousand people.'}}]},
{y:2021,t:'Fifty covers',x:'Old comics are selling for millions at auction and readers are stuck at home with money. Your sales manager wants fifty different covers on one first issue, and a line of digital collectibles that exist only as entries in a ledger.',
 n:'Real history. In 2021 a first-appearance comic sold for 3.6 million dollars, some new issues shipped with more than fifty variant covers, and publishers sold digital collectibles. Most of those collectibles later lost 80 to 95 percent of their price.',
 c:[{l:'Fifty covers and the digital collectibles',h:'A lot of money now. A bill later.',f(){S.cash+=16*X();S.flags.gimmick21=2;mod(1.2,2022);mod(.88,2025);return'The first issue sells four hundred thousand copies to perhaps thirty thousand people.'}},
    {l:'A few covers, no collectibles',h:'',f(){S.cash+=5*X();mod(1.08,2022);return'The shops sell what they order.'}},

function teamDlg(t){if(t.reprint){modal(`<h2>${t.name}</h2><p>This title reprints newspaper strips. Give it a writer and an artist to switch to new material. Quality will follow their skill.</p><label>Writer</label><select id="w"><option value="">None</option>${opts('W')}</select><label>Artist</label><select id="a"><option value="">None</option>${opts('A')}</select><div class="btns"><button id="ok">Save</button><button class="sec" id="no">Close</button></div>`)}
 else modal(`<h2>${t.name}</h2><label>Writer</label><select id="w"><option value="">None</option>${opts('W',t.w)}</select><label>Artist</label><select id="a"><option value="">None</option>${opts('A',t.a)}</select><div class="btns"><button id="ok">Save</button><button class="sec" id="no">Close</button></div>`);
 $('#no').onclick=closeModal;$('#ok').onclick=()=>{const w=+$('#w').value||null,a=+$('#a').value||null;if(t.reprint){if(w&&a){t.reprint=false;t.w=w;t.a=a}}else{t.w=w;t.a=a}closeModal();save();render()}}
function licDlg(t){const h=hero(t.hero),y=S.year;const rows=Object.keys(LIC).map(k=>{const L=LIC[k];if(y<L.from||y>L.to)return'';const has=h.deals.some(d=>d.k===k);const ok=h.recog>=L.need&&!has;const p=L.pay*X()*h.recog/60;
  return`<button class="choice" data-k="${k}" ${ok?'':'disabled'}>${L.n}<small>${has?'Deal running.':ok?`${money(p)} a year for ${L.yrs} years, and more people learn the name.`:`Needs recognition of ${L.need}.`}</small></button>`}).join('');
 modal(`<h2>License ${h.name}</h2><p class="mut">Recognition ${Math.round(h.recog)}</p>${rows||'<p>Nobody outside comics is buying heroes yet.</p>'}${y>2000?'<p class="mut">Film rights are handled separately in these years. The Sales channels card on the Company tab shows where they stand.</p>':''}<div class="btns"><button class="sec" id="no">Close</button></div>`);$('#no').onclick=closeModal;
 document.querySelectorAll('#mbox .choice').forEach(b=>b.onclick=()=>{const L=LIC[b.dataset.k];h.deals.push({k:b.dataset.k,until:y+L.yrs-1,pay:L.pay*X()*h.recog/60});h.recog=clamp(h.recog+L.rec,0,100);closeModal();save();render()})}
function launchDlg(){const y=S.year;let g=gOpen('hero',y)?'hero':'humor',o=null,name='';const st={pal:null};const avail=Object.keys(ORIG).filter(k=>y>=ORIG[k].from);
 const draw=()=>{if(g==='hero'){if(!o)o=avail[avail.length-1];if(!name)name=unusedHeroName(o)}else name=name||unusedTitle(g);
  const w=opts('W'),a=opts('A');
  modal(`<h2>Launch a title</h2><label>Genre</label><select id="g">${Object.keys(GEN).filter(k=>gOpen(k,y)).map(k=>`<option value="${k}" ${k===g?'selected':''}>${GEN[k].n} · demand ${interp(GEN[k].t,y)>=1.2?'high':interp(GEN[k].t,y)>=.7?'fair':'low'}</option>`).join('')}</select>
  ${g==='hero'?`<label>Origin</label><select id="o">${avail.map(k=>`<option value="${k}" ${k===o?'selected':''}>${ORIG[k].n}${y>ORIG[k].to?' (dated)':''}</option>`).join('')}</select><p class="mut">${ORIG[o].d}</p>`:''}
  ${g==='hero'?(st.name=name,st.o=o,pickerHtml(st,!S.heroes.length)):`<div class="row"><div class="grow"><label>Title</label><div style="font-weight:700;font-size:19px">${name}</div></div><button class="sm sec" id="re">Another name</button></div>`}
  <label style="display:block;margin-top:8px">Writer</label><select id="w">${w||'<option value="">Nobody free</option>'}</select><label>Artist</label><select id="a">${a||'<option value="">Nobody free</option>'}</select>
  ${!w||!a?'<p class="neg">You need a free writer and a free artist. Hire on the Talent tab.</p>':''}
  <div class="btns"><button id="ok" ${!w||!a?'disabled':''}>Launch · ${money(6*X())}</button><button class="sec" id="no">Close</button></div>`);
  $('#g').onchange=e=>{g=e.target.value;name='';draw()};if($('#o'))$('#o').onchange=e=>{o=e.target.value;if(!st.typed)name='';draw()};
  if(g==='hero'){bindPicker(st,()=>{let n2=st.name,i=0;while(n2===st.name&&i++<12)n2=unusedHeroName(o);name=n2;st.typed=0;return n2});$('#hn').addEventListener('input',e=>{name=e.target.value;st.typed=1})}else $('#re').onclick=()=>{let n2=name,i=0;while(n2===name&&i++<12)n2=unusedTitle(g);name=n2;draw()};$('#no').onclick=closeModal;
  $('#ok').onclick=()=>{const wv=+$('#w').value,av=+$('#a').value;S.cash-=6*X();let hid=null;if(g==='hero'){name=cleanName(st.name)||unusedHeroName(o);if(S.heroes.some(h=>h.name===name))name+=' II';const h=addHero(name,o);h.pal={su:st.pal.su,ac:st.pal.ac};h.fem=st.fem;hid=h.id;S.flags.named=1}addTitle({name,genre:g,hero:hid,w:wv,a:av});SFX.play('press');closeModal();save();render()}};draw()}
function vTalent(m){const card=(t,c)=>`<div class="card"><div class="row">${face(t)}<div class="grow"><b>${t.name}</b> <span class="pill ${t.role==='W'?'y':'g'}">${t.role==='W'?'Writer':'Artist'}</span>${t.fan?'<span class="pill">Fan turned pro</span>':''}${t.ghost?'<span class="pill">Uncredited</span>':''}${t.bio!=null&&BIO[t.bio]?`<div style="font-style:italic;font-size:14px;line-height:1.25;margin:2px 0">${BIO[t.bio][1]}</div>`:''}<div class="mut">Skill ${Math.round(t.skill)} · ${money(pay(t))} per title${c?'':` · ${load_of(t)}/${capOf()} titles · since ${t.hired}`}</div>
 ${c?'':`<div class="mut">Loyalty</div><div class="bar"><i style="width:${t.loy}%;background:${t.loy<30?'var(--red)':t.loy<60?'var(--yel)':'var(--grn)'}"></i></div>`}</div>
 ${c?`<button class="sm" data-h="${t.id}">Hire · ${money(pay(t)*.5)}</button>`:`<button class="sm red" data-f="${t.id}">Let go</button>`}</div></div>`;
 m.innerHTML=`<h2>Bullpen</h2><img class="pen" alt="" src="${bullpenArt()}">${S.staff.length?S.staff.map(t=>card(t)).join(''):'<p class="mut">Nobody on staff. Your one title runs on reprints.</p>'}<h2 style="margin-top:14px">Looking for work this year</h2>${S.cands.length?S.cands.map(t=>card(t,1)).join(''):'<p class="mut">Nobody else is looking this year.</p>'}`;
 m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const t=S.cands.find(x=>x.id===+b.dataset.h);S.cash-=pay(t)*.5;S.cands=S.cands.filter(x=>x!==t);S.staff.push(t);save();render()});
 m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{leave(tal(+b.dataset.f));save();render()})}
function backOffice(){const y=S.year,sold=S.flags.sold,rate=sold?12:Math.round(Math.max(.04,.15-.03*S.shells-(S.flags.partner?.03:0))*100),nm=['One company','Six corporations','A dozen corporations','Forty corporations, one secretary'],cost=[2,4,8][S.shells]*X();
 return `<div class="card"><h3 style="margin-top:0">Back office</h3><p class="mut">Tax on profits this year: <b>${rate}%</b>${S.flags.partner&&!sold?' (family partnership)':''}${sold?' (set by the parent company)':''}</p>
 <p style="margin:8px 0 2px"><b>${sold?'One Delaware subsidiary':nm[S.shells]}</b></p><p class="mut">${sold?'The owner has folded everything into one company.':'Each title can be published by its own corporation from the same desk. Every layer lowers the tax rate by three points and shrinks what a lawsuit can reach. It also adds paperwork, and tax examiners notice.'}</p>${!sold&&S.shells<3?`<div class="btns"><button class="sm" id="shell">Form more corporations · ${money(cost)}</button></div>`:''}
 ${y>=1972?`<p style="margin:12px 0 2px"><b>The back of the paycheck</b></p><p class="mut">A rights transfer is printed where the freelancer endorses the check. Cashing it signs the work over. It helps in court and costs loyalty every year.</p><div class="btns"><button class="sm ${S.checks?'blue':'sec'}" id="chk">${S.checks?'Printed on every check':'Plain checks'}</button></div>`:''}
 ${S.royalties||S.flags.share?`<p style="margin:12px 0 2px"><b>The second ledger</b></p><p class="mut">One set of books for the people owed a share, another for you. Royalty and profit-share payments fall by more than half. One audit ends it badly.</p><div class="btns"><button class="sm ${S.ledger?'red':'sec'}" id="led">${S.ledger?'Two sets of books':'One set of books'}</button></div>`:''}
 ${`<p class="mut" style="margin-top:12px">Credit report: <b>${['Good','Fair','Poor'][credit()]}</b>. ${['Paper and printing come on thirty days’ credit, and overhead is a little lower.','Suppliers ask for no special terms.','Suppliers want cash in advance, and overhead is higher.'][credit()]}${S.heroes.length?' Each hero is carried on the books at one dollar.':''}</p>`}
 ${y>=1961?`<p style="margin:12px 0 2px"><b>Renewals desk</b></p><p class="mut">A copyright lasts 28 years unless somebody files to renew it. Without a clerk watching the dates, old stories slip into the public domain.</p><div class="btns"><button class="sm ${S.renew?'blue':'sec'}" id="rnw">${S.renew?'A clerk files every renewal':'Nobody is watching the dates'}</button></div>`:''}
 ${y>=1964?`<p style="margin:12px 0 2px"><b>Trademark watch</b></p><p class="mut">An outside law firm reads every new filing and sends letters. A name that goes unused or undefended for three years can be taken. Costs a yearly fee and lifts license income.</p><div class="btns"><button class="sm ${S.tmWatch?'blue':'sec'}" id="tmw">${S.tmWatch?'The firm is on retainer':'No one is watching'}</button></div>`:''}
 ${y>=1980?`<p style="margin:12px 0 2px"><b>Character participation</b></p><p class="mut">Creators sign a form for every new character and get a share when it is licensed. You keep less license money. Loyalty rises each year, and creators are less likely to win against you in court.</p><div class="btns"><button class="sm ${S.particip?'blue':'sec'}" id="ptc">${S.particip?'Creators share in licensing':'The company keeps it all'}</button></div>`:''}
 ${S.flags.note?`<p class="mut" style="margin-top:10px">Subordinated note from the sale: ${money(S.flags.note.amt)}, due ${S.flags.note.due} if the parent’s other debts are paid.</p>`:''}</div>`}
function vCo(m){const dc=[0,30,80,160][S.dist]*X();
 const L=S.lead;m.innerHTML=`<h2>Company</h2>
 <div class="card"><h3 style="margin-top:0">Front office</h3><p class="mut">Owner: <b>${L.owner}</b>${L.owners>1?' (owner number '+L.owners+')':''}</p><div class="row" style="margin-bottom:8px">${face(L.pub)}<div class="grow"><b>${L.pub.name}</b><div class="mut">Publisher since ${L.pub.hired}. ${PUBT[L.pub.type].n}. ${PUBT[L.pub.type].d}</div></div></div>${L.pres?`<div class="row" style="margin-bottom:8px">${face(L.pres)}<div class="grow"><b>${L.pres.name}</b><div class="mut">President since ${L.pres.hired}, sent by the owner. ${PREST[L.pres.type].n.replace(/^an? /,'')}: ${PREST[L.pres.type].d}.</div></div></div>`:''}${L.log.slice(-6).reverse().map(e=>`<div class="mut">${e.y}: ${e.t}</div>`).join('')}</div>
 ${backOffice()}
 <div class="card"><h3 style="margin-top:0">Distribution, level ${S.dist} of 4</h3><p class="mut">Each level adds room for two more titles and moves more copies.${S.flags.congl?' The parent company’s presses and trucks add room for four more.':''}</p>${S.dist<4?`<button id="dist">Upgrade · ${money(dc)}</button>`:'<span class="pill g">Coast to coast</span>'}${S.flags.distDeal&&S.year<1963?'<p class="neg" style="margin-top:8px">Limited to four titles until 1963 by the distribution deal.</p>':''}</div>
 ${S.era2&&S.ch?chanCard():''}<div class="card"><h3 style="margin-top:0">Page rates</h3><p class="mut">Higher rates cost more and keep people loyal.</p><div class="btns">${['Low','Standard','Generous'].map((n,i)=>`<button class="sm ${S.rate===i?'blue':'sec'}" data-r="${i}">${n}</button>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Creator credits</h3><p class="mut">Printing names builds loyalty and attracts talent. Rivals can read the names too.</p><div class="btns"><button class="sm ${S.credits?'blue':'sec'}" id="cr">${S.credits?'Names are printed':'No names printed'}</button></div>
 ${S.royalties?'<p style="margin-top:8px"><span class="pill g">Royalties paid</span></p>':''}${S.flags.artReturn?'<p><span class="pill g">Original art returned</span></p>':''}${S.flags.direct?'<p><span class="pill g">Sold through comics shops</span></p>':''}${S.flags.code?'<p><span class="pill">Code seal on covers</span></p>':''}${S.flags.sold?'<p><span class="pill r">Owned by a conglomerate</span></p>':''}</div>
 <div class="card"><h3 style="margin-top:0">Heroes</h3>${S.heroes.length?S.heroes.slice().sort((a,b)=>b.recog-a.recog).map(h=>`<div class="trend"><span style="width:130px">${h.name}</span><div class="bar"><i style="width:${h.recog}%;background:var(--red)"></i></div></div>`).join(''):'<p class="mut">None yet.</p>'}</div>
 <div class="btns"><button class="sm sec" id="quit">Save and quit to title</button></div>`;
 if($('#chb'))$('#chb').onclick=()=>{S.cash-=8*(S.ch.book+1)*X();S.ch.book++;save();render()};if($('#chd'))$('#chd').onclick=()=>{S.cash-=6*(S.ch.digital+1)*X();S.ch.digital++;save();render()};
 if($('#rnw'))$('#rnw').onclick=()=>{S.renew=!S.renew;if(S.renew)archive('One fee or two','Real history. Under the old law a copyright ran 28 years and died unless it was renewed. One publisher fought the Copyright Office in federal court over whether a comic book could be renewed on a single form. The judge said the dispute came down to one four-dollar fee or two.');save();render()};if($('#tmw'))$('#tmw').onclick=()=>{S.tmWatch=!S.tmWatch;if(S.tmWatch)archive('Use it or lose it','Real history. A trademark lasts only while its owner keeps selling under it. Publishers revived the names of defunct companies’ heroes once they lapsed, and ran five-page tryout stories to keep their own marks alive. One legal budget ran almost double in 1973.');save();render()};if($('#ptc'))$('#ptc').onclick=()=>{S.particip=!S.particip;if(S.particip)archive('You can never tell','Real history. Around 1980 an editor-in-chief proposed paying creators when their characters were licensed, minor ones included, because nobody could tell which supporting player would become a star.');save();render()};
 if($('#shell'))$('#shell').onclick=()=>{S.cash-=[2,4,8][S.shells]*X();S.shells++;archive('Forty corporations','Real history. By the late 1960s one publisher controlled about forty corporations sharing a two-room suite and a secretary. On the newsstand they looked like separate publishers. On paper they were a legal tree of tax brackets and a set of liability shields.');save();render()};if($('#chk'))$('#chk').onclick=()=>{S.checks=!S.checks;if(S.checks)archive('The back of the paycheck','Real history. In the 1970s one publisher printed a copyright transfer on the back of freelancers’ paychecks. Cashing the check signed the work over.');save();render()};if($('#led'))$('#led').onclick=()=>{S.ledger=!S.ledger;if(S.ledger)archive('Two sets of books','Real history. During the Depression many pulp publishers kept two sets of books, one for auditors and one to see whether they were making any money.');save();render()};
 if($('#dist'))$('#dist').onclick=()=>{S.cash-=dc;S.dist++;save();render()};
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();render()});$('#cr').onclick=()=>{S.credits=!S.credits;save();render()};$('#quit').onclick=()=>{save();S=null;titleScreen()}}
function vCraft(m){const hasHero=S.heroes.some(h=>h.recog>=25&&S.titles.some(t=>t.hero===h.id));const y=S.year,GN=g=>g===ALLG?'Every genre':g.map(x=>GEN[x].n.replace('Costumed hero','Heroes').replace('Science fiction','Sci-fi')).join(', ');const have=TECH.filter(T=>S.tech[T.k]),open=TECH.filter(T=>!S.tech[T.k]&&y>=T.y),later=TECH.filter(T=>y<T.y).length;
 const card=(T,own)=>`<div class="card"><div class="row"><div class="grow"><b>${T.n}</b><div class="mut">${GN(T.g)} · quality +${T.b}${T.risk?' · some risk':''}${!own&&!T.risk&&y-T.y>=8?' · <span class="neg">rivals already use it</span>':''}</div></div>${own?'<span class="pill g">In use</span>':`<button class="sm" data-k="${T.k}">Learn · ${money(8*X())}</button>`}</div><p style="margin:6px 0 0;font-size:14px">${T.d}</p></div>`;
 m.innerHTML=`<h2>Craft</h2><p class="mut">How comics tell a story changed decade by decade. Each method the bullpen learns raises the quality of the genres it suits. Methods you skip start to cost you after eight years.</p>
 <h2 style="margin-top:14px">Legal department</h2><p class="mut">Some publishers treated the courtroom as part of the business. A suit that wins clears imitators off the rack and lifts your hero titles for four years. Every suit costs some goodwill, and others can sue you.</p>
 <div class="card"><div class="row"><div class="grow"><b>Lawyers on retainer</b><div class="mut">${money(2*X())} a year. Better odds in court and cheaper settlements.</div></div><button class="sm ${S.law.retainer?'blue':'sec'}" id="ret">${S.law.retainer?'On retainer':'None'}</button></div></div>
 <div class="card"><b>Sue a rival for copyright infringement</b><div class="mut">${hasHero?`Fees of ${money((S.law.retainer?4:6)*X())}. Your lawyers put the odds at about ${Math.round(lawOdds()*10)*10}%.${y>=1983?' The courts now treat powers and costumes as a genre.':''}`:'You need a hero in print that readers recognize.'}${y<S.law.cool?' The lawyers are busy until '+S.law.cool+'.':''}</div><div class="btns"><button class="sm red" id="sue" ${hasHero&&y>=S.law.cool?'':'disabled'}>File suit</button><button class="sm sec" id="cd" ${hasHero&&y>=S.law.cool?'':'disabled'}>Cease-and-desist letter · ${money(X())}</button></div>
 <div class="mut" style="margin-top:8px">Suits filed: ${S.law.filed}, won: ${S.law.won}. Suits against you: ${S.law.faced}, beaten: ${S.law.beat}.</div></div><h2 style="margin-top:14px">Storytelling</h2>${open.length?'<h3>Ready to learn</h3>'+open.map(T=>card(T)).join(''):''}${have.length?'<h3>In use</h3>'+have.map(T=>card(T,1)).join(''):''}<p class="mut">${later?later+' more method'+(later>1?'s are':' is')+' still to be invented.':'Every method of the century is on the table.'}</p>`;
 $('#ret').onclick=()=>{S.law.retainer=!S.law.retainer;save();render()};$('#sue').onclick=()=>sueRival(false);$('#cd').onclick=()=>sueRival(true);
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const T=TECH.find(x=>x.k===b.dataset.k);S.cash-=8*X();S.tech[T.k]=y;if(T.rep)S.rep=clamp(S.rep+T.rep,0,100);archive(T.n,T.d);save();render()})}
function vArch(m){nbSync();const nbn=nbCount(),nbN=evN().size;m.innerHTML=`<h2>Archive</h2><div class="card" id="nbk2" style="cursor:pointer"><div class="row"><b class="grow">Historian’s notebook</b><span class="pill y">${nbn} of ${nbN}</span></div><div class="nbbar"><i style="width:${(100*nbn/nbN).toFixed(1)}%"></i></div><div class="mut">${nbRank(nbn)}. Notes you have found in every game so far. Tap to open.</div></div><div class="card row" id="book2" style="cursor:pointer"><img class="cover" alt="" src="${bookArt()}"><div class="grow"><b>Understanding Superhero Comic Books</b><div class="mut">by Alex Grand. Tap for more.</div></div></div><p class="mut">The real history behind each event, with the chapter of <i>Understanding Superhero Comic Books</i> where it is told.</p><div class="card"><div class="row"><b class="grow">Sound</b><button data-snd class="sec" style="min-height:36px;font-size:15px;padding:4px 12px">Sound: ${SFX.isOn()?'on':'off'}</button></div><div class="row" style="margin-top:8px;gap:10px"><span class="mut">Volume</span><input id="vol" type="range" min="0" max="100" step="5" value="${Math.round(SFX.vol()*100)}" style="flex:1;accent-color:var(--red)"><b id="volv" style="min-width:38px;text-align:right">${Math.round(SFX.vol()*100)}%</b></div></div>`+wallHtml()+S.archive.slice().reverse().map(a=>`<div class="card"><span class="pill">${a.y}</span> <b>${a.t}</b><p style="margin:6px 0 0;font-size:14px">${a.n}</p></div>`).join('');bindWall(m);$('#nbk2').onclick=()=>nbDlg();$('#book2').onclick=bookDlg;$('#vol').oninput=e=>{SFX.setVol(+e.target.value/100);$('#volv').textContent=e.target.value+'%'};$('#vol').onchange=()=>SFX.play('cash')}
titleScreen();
</script></body></html>
