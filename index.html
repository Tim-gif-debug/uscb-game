/* ---------- modal ---------- */
function modal(html){$('#mbox').innerHTML=html;$('#modal').style.display='flex';$('#mbox').scrollTop=0}
function closeModal(){$('#modal').style.display='none'}
function info(title,body,cb){modal(`<h2>${title}</h2>${body}<div class="btns"><button id="ok">Continue</button></div>`);$('#ok').onclick=()=>{closeModal();cb&&cb()}}
function note(n){return n?`<div class="note"><b>From the history</b><br>${n}</div>`:''}
function archive(title,n){if(n&&!S.archive.some(a=>a.t===title))S.archive.push({y:S.year,t:title,n})}

/* ---------- events ---------- */
const X=()=>idx(S.year);
function mod(m,until,o){S.mods.push(Object.assign({m,until},o||{}))}
function loyAll(d,role){S.staff.forEach(t=>{if(!role||t.role===role)t.loy=clamp(t.loy+d,0,100)})}
function best(role){return S.staff.filter(t=>t.role===role).sort((a,b)=>b.skill-a.skill)[0]}
function leave(t){S.titles.forEach(x=>{if(x.w===t.id)x.w=null;if(x.a===t.id)x.a=null});S.staff=S.staff.filter(x=>x!==t)}
function heroTitles(){return S.titles.filter(t=>t.hero)}
function freeTeam(){const f=r=>S.staff.filter(t=>t.role===r&&load_of(t)<capOf()).sort((a,b)=>b.skill-a.skill)[0];return{w:f('W'),a:f('A')}}

 c:[{l:'License it to him for a dollar',h:'',f(){S.rep+=3;S.flags.tm=1;return'The trademark is protected and nobody is sued. He goes on ranting about you in his letters page, because the readers enjoy it.'}},
    {l:'Cease and desist',h:'',f(){S.fans=clamp(S.fans-4,0,100);S.rep-=2;return'He stops. He also prints your letter.'}},
    {l:'It is a joke. Leave it.',h:'',f(){S.flags.tmWeak=1;return'A button goes on sale at conventions: “I eat your heroes for breakfast.”'}}]},
{y:1987,t:'Pay my people',when:()=>S.flags.sold,x:()=>`${S.lead.owner} is preparing to sell. To make the year look better, the front office has stopped paying freelancers their foreign royalties and has cut the health plan. Your editor-in-chief is in the doorway.`,
 n:'Real history. An editor-in-chief said that before a 1986 sale the company held back royalties and benefits to inflate its results. He wrote to the new owners telling them where the bodies were buried, and was fired within months.',
 c:[{l:'Pay what is owed',h:'Costs money. The bullpen remembers.',f(){S.cash-=6*X();loyAll(10);S.rep+=3;return'The cheques go out with an apology.'}},
    {l:'Keep the numbers pretty',h:'Cash now. Somebody will write a letter.',f(){S.cash+=5*X();loyAll(-12);S.rep-=4;S.flags.bodies=1;return'Your editor-in-chief writes to the buyers and tells them how the profit was made. He is fired, and a freelancer burns him in effigy at a party anyway.'}}]},
{y:1990,t:'The club',x:'Your new heroine shares her name with a motorcycle club. The club turns out to be a corporation with a trademark lawyer. Three members in leathers are waiting for your general counsel in a mediation room.',
 n:'Real history. A motorcycle club sued a comics publisher in 1992 over a heroine’s name. The publisher argued the public already viewed the club with distaste, and lost that motion. It was settled in one afternoon with a new title and a $35,000 gift to a children’s charity.',
 c:[{l:'Rename her and give to a children’s charity',h:'',f(){S.cash-=1*X();S.rep+=3;return'Law schools will teach the afternoon as a model settlement. The new name belongs to a tiny publisher’s comic, and its owner calls a lawyer too.'}},
    {l:'Argue that their name has no good will to harm',h:'',f(){S.cash-=5*X();S.rep-=2;return'The judge denies your motion. One of the bikers asks the mediator why he has to sit there. “Because I order you to.”'}}]},
{y:1990,t:'Every pallet',x:'An editor you fired has started his own company. His first title is one syllable away from a name your British office announced and never shipped. He is about to print 700,000 copies and has a toy deal waiting.',
 n:'Real history. In 1993 a publisher sued a former editor-in-chief’s new company over a title. A judge held that publicity alone could establish a trademark, then found no confusion. The defense cost the small company a third of its cash and a toy licence, and it closed within a year.',
 c:[{l:'Get a restraining order at the printer',h:'It will cost him more than it costs you.',f(){S.cash-=3*X();S.rep-=5;loyAll(-4);return'The printer explains that his comics are stacked on every pallet that carries yours. To stop his is to stop your own. You withdraw. The judge tells you never to use his court as a business weapon again. The small company runs out of money anyway.'}},
    {l:'Leave him alone for a year',h:'',f(){S.rep+=3;return'His book ships. Yours never does.'}}]},
{y:1994,t:'Five editors-in-chief',when:()=>S.flags.public||S.flags.sold,x:'The business side is tired of an editor-in-chief who says no. The plan is to promote him sideways and split the line into five groups, each with its own chief and its own sales target.',
 n:'Real history. In 1994 a publisher replaced one editor-in-chief with five. The only one who hit his growth target did it by stretching a single storyline for years, and he was laid off in 1996 with more than forty percent of the editorial staff.',
 c:[{l:'Split the line',h:'Sales rise for a year. Stories stop ending.',f(){mod(1.06,1994);mod(.93,1997);loyAll(-10);S.flags.fiveEIC=1;return'The old chief keeps his office to give the look of stability. Sales will not let the clone story end.'}},
    {l:'Keep one editor between the staff and the owners',h:'',f(){loyAll(6);S.rep+=2;return'He goes on saying no.'}}]},
{y:1994,t:'Straight to the reader',when:()=>S.flags.direct,x:'A mail-order catalogue bound into your own comics could sell collections and merchandise directly to readers at a discount. The comics shops would be selling against their own supplier.',
 n:'Real history. A 1994 catalogue bound into comics sold direct to readers. Shop owners said it offered items they had been told they could not sell. A distributor who complained on their behalf was cut off.',
 c:[{l:'Print the catalogue',h:'Cash. The shops order less for two years.',f(){S.cash+=8*X();mod(.93,1995);S.fans=clamp(S.fans-3,0,100);return'In the catalogue’s comic strip your hero says that shopping in stores is too dangerous. A distributor’s newsletter is headed MAD AS HELL.'}},
    {l:'Leave retail to the shops',h:'',f(){S.rep+=2;return'The idea stays in a drawer.'}}]},
{y:1997,t:'The negative',when:()=>S.flags.film||S.heroes.some(h=>h.recog>=50),x:'A producer who optioned one of your teams years ago has made the film for almost nothing, only to keep his rights from lapsing. It is finished, and it looks like what it cost.',
 n:'Real history. In the early 1990s a film of a famous quartet was made for about $1.4 million to hold an option. The publisher’s film chief paid to take the negative and it was never released.',
 c:[{l:'Buy the negative and bury it',h:'Costs money.',f(){S.cash-=5*X();return'The cast learns from a trade paper that there will be no premiere.'}},
    {l:'Let it open',h:'',f(){S.heroes.forEach(h=>h.recog=clamp(h.recog-6,0,100));S.fans=clamp(S.fans-3,0,100);return'Bootleg tapes are sold at conventions for years.'}}]},
{y:1998,t:'You have been overpaid',when:()=>S.flags.debt||S.flags.public,x:'The accountants have gone back ten years and found small overpayments to freelancers, from fifty dollars to four thousand. A form letter is ready. Those who do not pay will be sent to a collection agency.',
 n:'Real history. After a 1998 reorganization a publisher mailed overpayment notices to freelancers going back almost a decade, and a litigation trust sued others for money they had been paid during the bankruptcy. One writer posted his $53 bill online.',
 c:[{l:'Mail the letters',h:'A little cash. A great deal of anger.',f(){S.cash+=2*X();loyAll(-15);S.rep-=6;S.flags.overpaid=1;return'A writer who once sued you posts his bill for fifty-three dollars under the heading “The High Cost of Working for Comics.”'}},
    {l:'Tear them up',h:'',f(){loyAll(5);S.rep+=2;return'The accountants are told to find the money somewhere else.'}}]},
{y:1999,t:'He may carry it',when:()=>S.heroes.length>0,x:()=>`An artist who left you has licensed an old patriotic hero from its creator and given him a round shield. It looks a great deal like the one ${topH().name} would carry if he carried one. His first issue is at the printer.`,
 n:'Real history. In 1997 a court let a rival patriotic hero keep his shield, his star and his colors, on the condition that he never throw the shield. The writer said the hero would fire missiles out of it instead.',
 c:[{l:'Go to court the night before he prints',h:'',f(){S.cash-=3*X();return'His lawyers show up, which yours did not expect. The judge lets the hero carry the shield and block with it. He may not throw it.'}},
    {l:'Let the readers decide',h:'',f(){S.rep+=2;return'Both heroes are on the rack in the same week.'}}]},

{y:1940,t:'Two pages of text',x:'The Post Office will not carry a comic book at the cheap magazine rate unless it has at least two pages of plain text in it. Nobody reads them. Somebody has to write them.',
 n:'Real history. Early comics carried two-page text stories to qualify for the cheaper mailing rate, and the newest writer in the office usually got the job.',
 c:[{l:'Give the job to the newest writer',h:'Overhead falls a little for good.',f(){S.flags.text=1;const w=S.staff.filter(t=>t.role==='W').sort((a,b)=>b.hired-a.hired)[0];if(w){w.skill=clamp(w.skill+2,0,96);return w.name+' writes a two-page thriller every week and gets better at it.'}return'The publisher writes them at lunch.'}},
    {l:'Pay the full postage',h:'',f(){return'You pay the higher rate.'}}]},
{y:1942,t:'The franchise tax',when:()=>!S.flags.sold,x:'The state’s franchise tax and its paperwork are heavy for a business that is really one desk. Your lawyer suggests dissolving the corporation and reopening the next morning as a two-person partnership with your wife. The profits would be taxed once, on your own return.',
 n:'Real history. One publisher dissolved his main corporation in 1942 and reopened it as a husband-and-wife partnership with pass-through taxes.',
 c:[{l:'Reopen as a partnership',h:'Your tax rate falls three points until the company is sold.',f(){S.flags.partner=1;return'The new letterhead arrives on Tuesday.'}},
    {l:'Stay a corporation',h:'',f(){return'You keep the seal and the minute book.'}}]},
{y:1942,t:'Old stories, new covers',when:()=>S.titles.some(t=>t.reprint),x:'You own a file drawer of stories that ran years ago. With a new title and a new cover, nobody at the newsstand would know. The word “reprint” appears nowhere.',
 n:'Real history. In 1942 the Federal Trade Commission ordered two pulp publishers to stop selling reprinted stories as new, and it came back in 1946 with the same complaint against twelve of one publisher’s companies.',
 c:[{l:'Sell them as new',h:'Reprint and shop titles sell more through 1946.',f(){S.flags.fakeNew=1;return'The drawer empties out.'}},
    {l:'Label the reprints',h:'',f(){S.rep+=2;return'A small line goes on the contents page.'}}]},
{y:1946,t:'The Commission returns',when:()=>S.flags.fakeNew,x:'The Federal Trade Commission has filed a complaint naming every one of your publishing companies. It says old stories were sold as new and abridged ones as complete.',
 n:'Real history. See the 1942 order.',
 c:[{l:'Sign the order and pay',h:'',f(){S.cash-=4*X();S.rep-=5;S.flags.fakeNew=0;return'Every reprint now says so, in small type.'}}]},
{y:1955,t:'Same numbers, new name',when:()=>S.flags.code&&S.dead.some(d=>/Code/.test(d.why||'')),x:'A cancelled crime comic still has a mailing permit and fifty-two issues of numbering. Your editor suggests bringing it back as a law-and-order book where justice always wins. It would pick up at issue fifty-three.',
 n:'Real history. In 1955 a crime comic resurfaced under a new title with the old numbering and a cover line promising that justice always wins.',
 c:[{l:'Bring it back',h:'A crime title at no launch cost, safe under the Code.',f(){const t=quickTitle('crime',{qb:3});t.start=S.year-5;return t.name+' starts with issue fifty-three.'}},
    {l:'Let it rest',h:'',f(){return'The permit lapses.'}}]},
{y:1957,t:'First in line',x:'Your distributor is in trouble and everybody knows it. Your lawyer has an idea. If one of your own companies is owed the most money when the distributor fails, your company is first in line for whatever is left.',
 n:'Real history. When one magazine distributor slid into bankruptcy in the 1930s, a publisher had already made his own company one of its largest creditors.',
 c:[{l:'Run up the invoices',h:'Cash when the distributor fails. Other publishers will know what you did.',f(){S.cash+=8*X();S.rep-=2;S.flags.creditor=1;return'Your claim is the first one read out in court.'}},
    {l:'Take your losses like everyone else',h:'',f(){return'You file your claim with the rest.'}}]},
{y:1958,t:'By the ton',x:'A man in a loud suit offers to buy your unsold returns by the ton, with the covers already torn off. He will staple new covers on them and sell them three for a quarter in bargain stores.',
 n:'Real history. One operator bought warehouses of coverless returns in the late 1950s, paid moonlighting artists for new covers and sold the comics in cellophane bags.',
 c:[{l:'Sell him the returns',h:'A little cash. Your old stories turn up under strange names.',f(){S.cash+=3*X();S.rep-=2;return'A truck backs up to the warehouse.'}},
    {l:'Pulp them',h:'',f(){return'The returns go to the paper mill.'}}]},
{y:1959,t:'The commissioners',x:'One of your men’s adventure magazines ran a story about a city in the South. Three of its commissioners are suing for libel. Their lawyers want to know why so many corporations share one two-room suite and one secretary.',
 n:'Real history. Three city officials sued a New York magazine company for libel in 1957, and the case tested how much protection a publisher’s layers of shell corporations really gave.',
 c:[{l:'Settle',h:'Shell corporations make it cheaper.',f(){const c=6*X()*(1-.15*S.shells);S.cash-=c;return'You pay '+money(c)+' and print a correction.'}},
    {l:'Fight it down there',h:'A home-town jury for the other side.',f(){if(Math.random()<.4){S.rep+=3;return'The case is thrown out on jurisdiction. The corporation that published the story has no office in that state.'}S.cash-=12*X()*(1-.15*S.shells);S.rep-=4;return'The jury takes forty minutes.'}}]},
{y:1966,t:'The renewal',when:()=>S.heroes.length>0&&!!best('A'),face:()=>best('A'),x:()=>{const h=S.heroes[0];return`The first copyright term on ${h.name} is running out. A former partner has sued to take the renewal. He says he created the hero alone and never signed anything. ${best('A').name} was there, and has a mortgage that depends on your checks.`},
 n:'Real history. In 1966 a Golden Age creator sued for the renewal copyright on a famous hero. The publisher persuaded a star artist who relied on its work to give an affidavit, and the affidavit undercut the claim.',
 c:[{l:'Ask your artist for an affidavit',h:'You will win. The artist will not forget being asked.',f(){const a=best('A');a.loy=clamp(a.loy-18,0,100);S.flags.affidavit=1;S.flags.paper=1;return a.name+' signs. The claim collapses, and the two old partners stop speaking.'}},
    {l:'Buy a signed assignment from the partner',h:'Costs money. The paperwork is clean from now on.',f(){S.cash-=10*X();S.flags.paper=1;S.rep+=3;return'He signs, and for once it is all in writing.'}},
    {l:'Fight without the affidavit',h:'Less than even odds.',f(){if(Math.random()<.45){S.flags.paper=1;return'The judge finds he was an employee. You keep the hero.'}const h=S.heroes[0],t=S.titles.find(t=>t.hero===h.id);if(t)cancelTitle(t,'Lost at renewal');S.heroes=S.heroes.filter(x=>x!==h);return'You lose. '+h.name+' goes home with the man who drew him first.'}}]},
{y:1969,t:'A new company in Delaware',when:()=>S.flags.sold,x:()=>`${S.lead.owner} has formed a new subsidiary in Delaware and moved every copyright into it. The renewal forms now list your old writers and artists as “employees for hire” of corporations that no longer exist. Nobody asked them to sign.`,
 n:'Real history. After a 1968 sale the buyer set up a Delaware subsidiary, transferred the copyrights there and renewed them with the creators tagged as employees for hire of the old shell companies.',
 c:[{l:'Let the lawyers handle it',h:'Stronger in court. The bullpen hears about it.',f(){S.flags.wfh=1;loyAll(-8);return'The forms are filed.'}},
    {l:'Get real signatures and pay for them',h:'Costs money. Stronger in court and fair.',f(){S.cash-=8*X();S.flags.paper=1;loyAll(6);S.rep+=3;return'Each creator gets a check and a copy of what was signed.'}}]},
{y:1977,t:'The audit clause',when:()=>S.heroes.some(h=>h.recog>=40),x:'A studio wants television rights to your heroes. Your agent spends a month on the contract. He wants a clause that lets you audit the studio’s books, so your share is not lost among its other projects.',
 n:'Real history. In 1977 an agent locked an audit clause into a television deal so that a publisher’s royalties would not be swallowed by the studio’s other projects.',
 c:[{l:'Pay for the long contract',h:'A small cost. License income rises for good.',f(){S.cash-=2*X();S.flags.auditClause=1;return'The clause is on page nineteen.'}},
    {l:'A handshake is enough',h:'',f(){S.flags.handshake=1;return'The first royalty statement shows the series losing money.'}}]},
{y:1978,t:'One page',x:'A new copyright law lets creators take back work they sold after a waiting period, unless it was made for hire. Your lawyers have a one-page form saying the company is the legal author of everything. Some of the writers are talking about forming a guild.',
 n:'Real history. In 1978 one publisher required every freelancer to sign a one-page work-for-hire form, and an informal writers’ union effort that year lost the negotiation.',
 c:[{l:'No signature, no check',h:'Strong in court. Loyalty and reputation fall.',f(){S.flags.wfh=1;loyAll(-12);S.rep-=3;return'A cartoonist tells a roundtable that when you sign that check you have given away everything.'}},
    {l:'The form, with promises in writing',h:'Costs money. Insurance, reprint fees and art returns are guaranteed.',f(){S.flags.wfh=1;S.cash-=5*X();S.flags.artReturn=1;S.flags.benefits=1;loyAll(4);return'The cover letter ends, “Please feel free to consult a lawyer.”'}},
    {l:'Recognize the writers’ guild',h:'No form. Page rates go to generous. The bullpen is yours.',f(){S.rate=2;loyAll(15);S.rep+=5;S.flags.guild=1;return'The first meeting is held in your conference room.'}}]},
{y:1992,t:'Cards and stickers',when:()=>S.flags.gimmick||S.flags.public,x:'Trading cards are selling faster than the comics. A card company is for sale and the bankers say it will pay for itself in two years.',
 n:'Real history. One publisher bought into trading cards at the top of the market and took a forty-million-dollar write-off on unsold cards in 1995.',
 c:[{l:'Buy the card company',h:'Costs money. Strong income through 1994.',f(){S.cash-=20*X();S.flags.cards=1;return'The first set ships with a hologram.'}},
    {l:'Stay in comics',h:'',f(){return'You pass.'}}]},
{y:1993,t:'Holdings One, Two and Three',when:()=>S.lead.owner==='Brandt & Voss Holdings',x:'The financier has set up three Delaware shells. Each one holds a block of your company’s stock, pledges it as collateral and sells junk bonds against it. The money goes upstream to his holding company as dividends. None of it goes into comics.',
 n:'Real history. In 1993 and 1994 three Delaware holding shells pledged a publisher’s stock for junk bonds with a face value near nine hundred million dollars, and most of the dividends went to the owner’s holding company. A trust later sued the former directors over them.',
 c:[{l:'Put your objection in writing',h:'Reputation rises. The publisher may be replaced.',f(){S.rep+=5;S.flags.objected=1;if(Math.random()<.4){const p=mkExec('suit');p.hired=S.year;S.lead.pub=p;logLead(p.name+' is installed as publisher.');return'The memo is answered in a week. '+p.name+' has your publisher’s office.'}return'The memo is filed. It will matter to a judge one day.'}},
    {l:'Keep the presses running',h:'',f(){return'The bonds sell out in an afternoon.'}}]},
{y:1995,t:'A distributor of your own',when:()=>S.flags.direct,x:'A dozen distributors carry comics to the shops. Your owners want to buy one and sell your books through it alone. Every other distributor would lose its biggest line overnight.',
 n:'Real history. One publisher bought its own distributor in the mid-1990s. The second-largest distributor sued the same day, and within two years a single company was left carrying everyone else.',
 c:[{l:'Buy it',h:'Costs money. Shops struggle to get your books for three years.',f(){S.cash-=15*X();mod(.85,1997);S.rep-=5;S.flags.ownDist=1;return'A rival distributor files suit three hours after the announcement.'}},
    {l:'Leave the system alone',h:'',f(){S.rep+=2;return'The shops keep ordering the way they always have.'}}]},
{y:1996,t:'Dolls or toys?',when:()=>S.heroes.some(h=>h.deals.some(d=>d.k==='toys'))||S.flags.film||S.lead.owner==='Kessler Toy Works',x:'Customs charges twelve percent on imported dolls, which represent human beings, and about half that on toys that represent creatures. Your lawyers propose telling a federal court that your heroes are not human.',
 n:'Real history. A toy company fought Customs through the late 1990s over some ninety imported action figures, arguing that the heroes were non-human creatures and owed the lower duty.',
 c:[{l:'Argue that they are not human',h:'Saves money. The fans will read the filing.',f(){S.cash+=5*X();S.fans=clamp(S.fans-6,0,100);S.flags.nonhuman=1;return'The court agrees, figure by figure. Fans point out that the comics have said the opposite for thirty years.'}},
    {l:'Pay the doll rate',h:'',f(){S.rep+=2;return'Your heroes stay human, at twelve percent.'}}]},

{y:1989,t:'A kid with a fanzine',when:()=>!!topHT(),x:()=>`Scooter Flintlock works the counter at a comics shop and publishes a fanzine. He wants to know who really created ${hero(topHT().hero).name}. He has already talked to a retired artist, a letterer and a former secretary. Now he is in your lobby asking to see the files.`,
 n:'Fan historians with tape recorders have settled more questions of who created what than most courtrooms have.',
 c:[{l:'Open the files',h:'Reputation rises a little. He will write what he finds.',f(){S.flags.zine='open';S.rep+=3;return'He spends three days in the file room with a notebook.'}},
    {l:'“No unsolicited visitors”',h:'',f(){S.flags.zine='shut';return'The guard walks him out. He keeps digging.'}}]},
{y:1995,t:'The convention panel',when:()=>S.flags.zine,x:()=>{const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;return fair?`Scooter Flintlock’s history of ${S.co} is the talk of the convention. It names every writer and artist who built your heroes, and it says the company did right by them. He asks your veterans to sign copies.`:`Your publisher is on stage at the big convention when Scooter Flintlock takes the microphone. He has the interviews, the dates and the pages. He tells two thousand fans who drew what, and who took the credit.`},
 n:'Fan historians with tape recorders have settled more questions of who created what than most courtrooms have.',
 c:[{l:'Share the stage',h:'If the record is clean this costs nothing. If not, it costs money and you credit the co-creators.',f(){const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;if(fair){S.rep+=8;S.fans=clamp(S.fans+8,0,100);return'The room stands up for the old-timers.'}S.cash-=8*X();S.credits=true;S.rep+=4;S.flags.pension=1;loyAll(8);return'Your publisher calls the co-creators up from the audience. The checks and the credit lines follow.'}},
    {l:'Have security handle it',h:'',f(){const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;if(fair){S.rep-=2;return'There was nothing to handle. It looks odd.'}S.rep-=12;S.fans=clamp(S.fans-12,0,100);S.flags.exposed=1;return'The crowd is chanting his name as he is led out. It is in every fanzine by Monday.'}}]},
{y:1999,t:'The typed script',when:()=>S.flags.sold&&!!topHT(),x:()=>`Lawyers for ${S.lead.owner} have found that two retired artists may be owed payments for life as co-creators of ${hero(topHT().hero).name}. They ask your publisher emeritus to swear he created every hero alone. A typed script for the first issue would help, they say, and nobody needs to ask when it was typed.`,
 n:'Fan historians with tape recorders have settled more questions of who created what than most courtrooms have.',
 c:[{l:'Tell the lawyers the truth',h:'The stipends cost money. The record is straight.',f(){S.cash-=10*X();S.rep+=10;S.flags.honest=1;loyAll(8);return'The statement names both artists as co-creators. The owners are furious and the checks go out.'}},
    {l:'Sign the statement',h:'Saves the money.',f(){S.cash+=6*X();S.rep-=12;loyAll(-10);S.flags.perjury=1;return'The script is entered as evidence. Everyone who was there knows when it was typed.'}}]},

{y:1933,t:'Soap coupons',x:'The first comic booklets are not sold at all. A soap company mails them free to customers who send in coupons, and a five-and-dime chain has started stocking others. A soap maker asks whether you would print a giveaway for its brand.',
 n:'An eight-page promotional comic of 1933 was mailed free to customers who sent in coupons. A 36-page book of reprints went out through a department store chain the same year. Introduction.',
 c:[{l:'Print the giveaway',h:'A flat fee for three years.',f(){S.flags.premium=1935;S.cash+=2*X();return'The soap company pays on delivery, and the booklets go out by the sackful.'}},
    {l:'Newsstand only',h:'',f(){S.rep+=2;return'You would rather have readers who pay a dime.'}}]},
{y:1936,t:'The shop down the street',x:'A packaging shop has opened in a loft nearby. A dozen teenagers at drawing boards turn out complete comic books to order, signed with invented names, and the owner sells them by the page.',
 n:'Many early publishers bought finished comics from packaging shops, and several of the best Golden Age artists started in them. Chapters 10 and 13.',
 c:[{l:'Order a title from the shop',h:'A title with no staff of your own. Fair quality, low cost.',f(){const g=pick(['western','crime','scifi']);const t=addTitle({name:unusedTitle(g),genre:g,hero:null,w:null,a:null,reprint:true,shop:1,qb:8});return t.name+' arrives lettered, inked and ready for the printer.'}},
    {l:'Hire two of the shop’s best',h:'Signing costs money.',f(){S.cash-=3*X();S.staff.push(newTalent('A',R(62,72)),newTalent('W',R(56,66)));return'Two of the teenagers bring their brushes over on Monday.'}},
    {l:'Pass',h:'',f(){return'You pass.'}}]},
{y:1946,t:'Comics for classrooms',x:'A church publisher wants a comic book of history and science stories to hand out in parochial schools every two weeks. It would never appear on a newsstand.',
 n:'A comic distributed through parochial schools began in 1946 and gave veteran artists steady work for years. Chapter 10.',
 c:[{l:'Take the contract',h:'Steady income through 1958. Reputation rises.',f(){S.flags.school=1958;S.rep+=6;return'The first issue explains how a dam works.'}},
    {l:'Decline',h:'',f(){return'You decline.'}}]},
{y:1948,t:'A cowboy star’s name',x:'Television has made stars of the movie cowboys. An agent offers the right to put his client’s name and photograph on a western comic.',
 n:'Comics with licensed material multiplied in 1948 as television grew. Introduction.',
 c:[{l:'Buy the license',h:'Costs money. A western title that sells on the name through 1956.',f(){S.cash-=8*X();const t=quickTitle('western',{qb:6});mod(1.3,1956,{title:t.id});t.licensed=1;return t.name+' gets a photo cover of the man himself.'}},
    {l:'Too rich',h:'',f(){return'You pass.'}}]},
{y:1951,t:'Thirty-two pages',x:'Paper and printing cost more every year. Your comics are still 52 pages for a dime. The printer says everyone else is cutting to 32.',
 n:'Readers who once got 52 pages for 10 cents were getting 32 pages for the same price. Introduction.',
 c:[{l:'Cut to 32 pages',h:'Overhead falls for good. Readers notice.',f(){S.flags.pages32=1;S.rep-=3;return'The back-up features are dropped.'}},
    {l:'Hold at 52 pages',h:'Overhead stays high through 1960. Readers approve.',f(){S.flags.bigbook=1960;S.rep+=4;return'“Still 52 pages for a dime” goes on every cover.'}}]},
{y:1961,t:'A letter from a fan',x:'A reader whose address ran on your letters page has heard from forty other readers. He is starting a mimeographed magazine about comics and asks for an interview and a list of your back issues.',

    {l:'Charge the overhead to their book',h:'Saves the money. They may find out.',f(){const t=topHT(),w=tal(t.w),a=tal(t.a);if(Math.random()<.65){leave(w);leave(a);const kid=newTalent('W',46,'M');kid.fresh=16;kid.left=40;S.staff.push(kid);t.w=kid.id;S.flags.kid=kid.id;S.rep-=3;return`They find the real figures and take a meeting with your biggest rival. You fire them both. ${kid.name}, the nineteen-year-old who fills the inkwells, is the only one left who knows the books. He is now the editor.`}return'Nobody checks the arithmetic.'}}]},
{y:1941,t:'A copy of your hero',when:()=>!S.flags.copycat&&S.heroes.some(h=>h.recog>=28&&S.titles.some(t=>t.hero===h.id)),x:()=>{const h=S.heroes.filter(h=>S.titles.some(t=>t.hero===h.id)).sort((a,b)=>b.recog-a.recog)[0];return`A rival has a new hero with the same powers as ${h.name} and a cape in a different color. This month the copy outsold the original.`},

    {l:'Everybody signs their own work',h:'Creator credits are switched on.',f(){S.credits=true;loyAll(4,'A');return'The signature box gets a second line.'}}]},
{y:1947,t:'One issue',x:'A newspaperman has published a comic book written and drawn entirely by Black creators. It lasted one issue. He asks whether your company would put out a second.',

{y:1956,t:'The astronaut',when:()=>S.flags.code&&S.staff.length>1,x:'Your science fiction story ends with an astronaut taking off his helmet. He is a Black man. The Code’s administrator says the story cannot run unless he is redrawn.',

{y:1955,t:'Out from under the Code',when:()=>S.flags.code&&S.titles.some(t=>t.satire&&!t.magazine),x:'The Code has taken the teeth out of your satire comic. The editor says a 25-cent magazine with no seal would answer to nobody.',

 ${c?`<button class="sm" data-h="${t.id}">Hire · ${money(pay(t)*.5)}</button>`:`<button class="sm red" data-f="${t.id}">Let go</button>`}</div></div>`;
 m.innerHTML=`<h2>Bullpen</h2><img class="pen" alt="" src="${bullpenArt()}">${S.staff.length?S.staff.map(t=>card(t)).join(''):'<p class="mut">Nobody on staff. Your one title runs on reprints.</p>'}<h2 style="margin-top:14px">Looking for work this year</h2>${S.cands.length?S.cands.map(t=>card(t,1)).join(''):'<p class="mut">Nobody else is looking this year.</p>'}`;
 m.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const t=S.cands.find(x=>x.id===+b.dataset.h);S.cash-=pay(t)*.5;S.cands=S.cands.filter(x=>x!==t);S.staff.push(t);save();render()});
 m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{leave(tal(+b.dataset.f));save();render()})}
function backOffice(){const y=S.year,sold=S.flags.sold,rate=sold?12:Math.round(Math.max(.04,.15-.03*S.shells-(S.flags.partner?.03:0))*100),nm=['One company','Six corporations','A dozen corporations','Forty corporations, one secretary'],cost=[2,4,8][S.shells]*X();
 return `<div class="card"><h3 style="margin-top:0">Back office</h3><p class="mut">Tax on profits this year: <b>${rate}%</b>${S.flags.partner&&!sold?' (family partnership)':''}${sold?' (set by the parent company)':''}</p>
 <p style="margin:8px 0 2px"><b>${sold?'One Delaware subsidiary':nm[S.shells]}</b></p><p class="mut">${sold?'The owner has folded everything into one company.':'Each title can be published by its own corporation from the same desk. Every layer lowers the tax rate by three points and shrinks what a lawsuit can reach. It also adds paperwork, and tax examiners notice.'}</p>${!sold&&S.shells<3?`<div class="btns"><button class="sm" id="shell">Form more corporations · ${money(cost)}</button></div>`:''}
 ${y>=1972?`<p style="margin:12px 0 2px"><b>The back of the paycheck</b></p><p class="mut">A rights transfer is printed where the freelancer endorses the check. Cashing it signs the work over. It helps in court and costs loyalty every year.</p><div class="btns"><button class="sm ${S.checks?'blue':'sec'}" id="chk">${S.checks?'Printed on every check':'Plain checks'}</button></div>`:''}
 ${S.royalties||S.flags.share?`<p style="margin:12px 0 2px"><b>The second ledger</b></p><p class="mut">One set of books for the people owed a share, another for you. Royalty and profit-share payments fall by more than half. One audit ends it badly.</p><div class="btns"><button class="sm ${S.ledger?'red':'sec'}" id="led">${S.ledger?'Two sets of books':'One set of books'}</button></div>`:''}
 ${`<p class="mut" style="margin-top:12px">Credit report: <b>${['Good','Fair','Poor'][credit()]}</b>. ${['Paper and printing come on thirty days’ credit, and overhead is a little lower.','Suppliers ask for no special terms.','Suppliers want cash in advance, and overhead is higher.'][credit()]}${S.heroes.length?' Each hero is carried on the books at one dollar.':''}</p>`}
 ${y>=1961?`<p style="margin:12px 0 2px"><b>Renewals desk</b></p><p class="mut">A copyright lasts 28 years unless somebody files to renew it. Without a clerk watching the dates, old stories slip into the public domain.</p><div class="btns"><button class="sm ${S.renew?'blue':'sec'}" id="rnw">${S.renew?'A clerk files every renewal':'Nobody is watching the dates'}</button></div>`:''}
 ${y>=1964?`<p style="margin:12px 0 2px"><b>Trademark watch</b></p><p class="mut">An outside law firm reads every new filing and sends letters. A name that goes unused or undefended for three years can be taken. Costs a yearly fee and lifts license income.</p><div class="btns"><button class="sm ${S.tmWatch?'blue':'sec'}" id="tmw">${S.tmWatch?'The firm is on retainer':'No one is watching'}</button></div>`:''}
 ${y>=1980?`<p style="margin:12px 0 2px"><b>Character participation</b></p><p class="mut">Creators sign a form for every new character and get a share when it is licensed. You keep less license money. Loyalty rises each year, and creators are less likely to win against you in court.</p><div class="btns"><button class="sm ${S.particip?'blue':'sec'}" id="ptc">${S.particip?'Creators share in licensing':'The company keeps it all'}</button></div>`:''}
 ${S.flags.note?`<p class="mut" style="margin-top:10px">Subordinated note from the sale: ${money(S.flags.note.amt)}, due ${S.flags.note.due} if the parent’s other debts are paid.</p>`:''}</div>`}
function vCo(m){const dc=[0,30,80,160][S.dist]*X();
 const L=S.lead;m.innerHTML=`<h2>Company</h2>
 <div class="card"><h3 style="margin-top:0">Front office</h3><p class="mut">Owner: <b>${L.owner}</b>${L.owners>1?' (owner number '+L.owners+')':''}</p><div class="row" style="margin-bottom:8px">${face(L.pub)}<div class="grow"><b>${L.pub.name}</b><div class="mut">Publisher since ${L.pub.hired}. ${PUBT[L.pub.type].n}. ${PUBT[L.pub.type].d}</div></div></div>${L.pres?`<div class="row" style="margin-bottom:8px">${face(L.pres)}<div class="grow"><b>${L.pres.name}</b><div class="mut">President since ${L.pres.hired}, sent by the owner. ${PREST[L.pres.type].n.replace(/^an? /,'')}: ${PREST[L.pres.type].d}.</div></div></div>`:''}${L.log.slice(-6).reverse().map(e=>`<div class="mut">${e.y}: ${e.t}</div>`).join('')}</div>
 ${backOffice()}
 <div class="card"><h3 style="margin-top:0">Distribution, level ${S.dist} of 4</h3><p class="mut">Each level adds room for two more titles and moves more copies.${S.flags.congl?' The parent company’s presses and trucks add room for four more.':''}</p>${S.dist<4?`<button id="dist">Upgrade · ${money(dc)}</button>`:'<span class="pill g">Coast to coast</span>'}${S.flags.distDeal&&S.year<1963?'<p class="neg" style="margin-top:8px">Limited to four titles until 1963 by the distribution deal.</p>':''}</div>
 <div class="card"><h3 style="margin-top:0">Page rates</h3><p class="mut">Higher rates cost more and keep people loyal.</p><div class="btns">${['Low','Standard','Generous'].map((n,i)=>`<button class="sm ${S.rate===i?'blue':'sec'}" data-r="${i}">${n}</button>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Creator credits</h3><p class="mut">Printing names builds loyalty and attracts talent. Rivals can read the names too.</p><div class="btns"><button class="sm ${S.credits?'blue':'sec'}" id="cr">${S.credits?'Names are printed':'No names printed'}</button></div>
 ${S.royalties?'<p style="margin-top:8px"><span class="pill g">Royalties paid</span></p>':''}${S.flags.artReturn?'<p><span class="pill g">Original art returned</span></p>':''}${S.flags.direct?'<p><span class="pill g">Sold through comics shops</span></p>':''}${S.flags.code?'<p><span class="pill">Code seal on covers</span></p>':''}${S.flags.sold?'<p><span class="pill r">Owned by a conglomerate</span></p>':''}</div>
 <div class="card"><h3 style="margin-top:0">Heroes</h3>${S.heroes.length?S.heroes.slice().sort((a,b)=>b.recog-a.recog).map(h=>`<div class="trend"><span style="width:130px">${h.name}</span><div class="bar"><i style="width:${h.recog}%;background:var(--red)"></i></div></div>`).join(''):'<p class="mut">None yet.</p>'}</div>
 <div class="btns"><button class="sm sec" id="quit">Save and quit to title</button></div>`;
 if($('#rnw'))$('#rnw').onclick=()=>{S.renew=!S.renew;if(S.renew)archive('One fee or two','Real history. Under the old law a copyright ran 28 years and died unless it was renewed. One publisher fought the Copyright Office in federal court over whether a comic book could be renewed on a single form. The judge said the dispute came down to one four-dollar fee or two.');save();render()};if($('#tmw'))$('#tmw').onclick=()=>{S.tmWatch=!S.tmWatch;if(S.tmWatch)archive('Use it or lose it','Real history. A trademark lasts only while its owner keeps selling under it. Publishers revived the names of defunct companies’ heroes once they lapsed, and ran five-page tryout stories to keep their own marks alive. One legal budget ran almost double in 1973.');save();render()};if($('#ptc'))$('#ptc').onclick=()=>{S.particip=!S.particip;if(S.particip)archive('You can never tell','Real history. Around 1980 an editor-in-chief proposed paying creators when their characters were licensed, minor ones included, because nobody could tell which supporting player would become a star.');save();render()};
 if($('#shell'))$('#shell').onclick=()=>{S.cash-=[2,4,8][S.shells]*X();S.shells++;archive('Forty corporations','Real history. By the late 1960s one publisher controlled about forty corporations sharing a two-room suite and a secretary. On the newsstand they looked like separate publishers. On paper they were a legal tree of tax brackets and a set of liability shields.');save();render()};if($('#chk'))$('#chk').onclick=()=>{S.checks=!S.checks;if(S.checks)archive('The back of the paycheck','Real history. In the 1970s one publisher printed a copyright transfer on the back of freelancers’ paychecks. Cashing the check signed the work over.');save();render()};if($('#led'))$('#led').onclick=()=>{S.ledger=!S.ledger;if(S.ledger)archive('Two sets of books','Real history. During the Depression many pulp publishers kept two sets of books, one for auditors and one to see whether they were making any money.');save();render()};
 if($('#dist'))$('#dist').onclick=()=>{S.cash-=dc;S.dist++;save();render()};
 m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();render()});$('#cr').onclick=()=>{S.credits=!S.credits;save();render()};$('#quit').onclick=()=>{save();S=null;titleScreen()}}
function vCraft(m){const hasHero=S.heroes.some(h=>h.recog>=25&&S.titles.some(t=>t.hero===h.id));const y=S.year,GN=g=>g===ALLG?'Every genre':g.map(x=>GEN[x].n.replace('Costumed hero','Heroes').replace('Science fiction','Sci-fi')).join(', ');const have=TECH.filter(T=>S.tech[T.k]),open=TECH.filter(T=>!S.tech[T.k]&&y>=T.y),later=TECH.filter(T=>y<T.y).length;
 const card=(T,own)=>`<div class="card"><div class="row"><div class="grow"><b>${T.n}</b><div class="mut">${GN(T.g)} · quality +${T.b}${T.risk?' · some risk':''}${!own&&!T.risk&&y-T.y>=8?' · <span class="neg">rivals already use it</span>':''}</div></div>${own?'<span class="pill g">In use</span>':`<button class="sm" data-k="${T.k}">Learn · ${money(8*X())}</button>`}</div><p style="margin:6px 0 0;font-size:14px">${T.d}</p></div>`;
 m.innerHTML=`<h2>Craft</h2><p class="mut">How comics tell a story changed decade by decade. Each method the bullpen learns raises the quality of the genres it suits. Methods you skip start to cost you after eight years.</p>
 <h2 style="margin-top:14px">Legal department</h2><p class="mut">Some publishers treated the courtroom as part of the business. A suit that wins clears imitators off the rack and lifts your hero titles for four years. Every suit costs some goodwill, and others can sue you.</p>
 <div class="card"><div class="row"><div class="grow"><b>Lawyers on retainer</b><div class="mut">${money(2*X())} a year. Better odds in court and cheaper settlements.</div></div><button class="sm ${S.law.retainer?'blue':'sec'}" id="ret">${S.law.retainer?'On retainer':'None'}</button></div></div>
 <div class="card"><b>Sue a rival for copyright infringement</b><div class="mut">${hasHero?`Fees of ${money((S.law.retainer?4:6)*X())}. Your lawyers put the odds at about ${Math.round(lawOdds()*10)*10}%.${y>=1983?' The courts now treat powers and costumes as a genre.':''}`:'You need a hero in print that readers recognize.'}${y<S.law.cool?' The lawyers are busy until '+S.law.cool+'.':''}</div><div class="btns"><button class="sm red" id="sue" ${hasHero&&y>=S.law.cool?'':'disabled'}>File suit</button><button class="sm sec" id="cd" ${hasHero&&y>=S.law.cool?'':'disabled'}>Cease-and-desist letter · ${money(X())}</button></div>
 <div class="mut" style="margin-top:8px">Suits filed: ${S.law.filed}, won: ${S.law.won}. Suits against you: ${S.law.faced}, beaten: ${S.law.beat}.</div></div><h2 style="margin-top:14px">Storytelling</h2>${open.length?'<h3>Ready to learn</h3>'+open.map(T=>card(T)).join(''):''}${have.length?'<h3>In use</h3>'+have.map(T=>card(T,1)).join(''):''}<p class="mut">${later?later+' more method'+(later>1?'s are':' is')+' still to be invented.':'Every method of the century is on the table.'}</p>`;
 $('#ret').onclick=()=>{S.law.retainer=!S.law.retainer;save();render()};$('#sue').onclick=()=>sueRival(false);$('#cd').onclick=()=>sueRival(true);
 m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const T=TECH.find(x=>x.k===b.dataset.k);S.cash-=8*X();S.tech[T.k]=y;if(T.rep)S.rep=clamp(S.rep+T.rep,0,100);archive(T.n,T.d);save();render()})}
function vArch(m){m.innerHTML=`<h2>Archive</h2><div class="card row" id="book2" style="cursor:pointer"><img class="cover" alt="" src="${bookArt()}"><div class="grow"><b>Understanding Superhero Comic Books</b><div class="mut">by Alex Grand. Tap for more.</div></div></div><p class="mut">The real history behind each event, with the chapter of <i>Understanding Superhero Comic Books</i> where it is told.</p>`+S.archive.slice().reverse().map(a=>`<div class="card"><span class="pill">${a.y}</span> <b>${a.t}</b><p style="margin:6px 0 0;font-size:14px">${a.n}</p></div>`).join('');$('#book2').onclick=bookDlg}
titleScreen();
</script></body></html>
