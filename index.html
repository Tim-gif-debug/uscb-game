 c:[{l:'Pay for the survey',h:'Costs a little. Better sales for three years.',f(){S.cash-=1*X();mod(1.1,1941);S.heroes.forEach(h=>h.recog=clamp(h.recog+5,0,100));return'The dealers all name the same feature. You put it on every cover from now on.'}},
    {l:'Guess',h:'',f(){if(Math.random()<.4){mod(1.1,1941);return'You guess right, and the next issue sells out.'}return'You put the cowboy on the cover for six months. It was not the cowboy.'}}]},
{y:1939,t:'Two of a kind',when:()=>heroTitles().length>0,x:()=>`A pulp house has a new masked hero who looks so much like ${heroTitles()[0].name} that the two could trade costumes. Each was on a drawing board before the other was printed. Their lawyers and yours have drafted the same letter.`,
 n:'Real history. In 1939 a comic-book hero and a pulp hero appeared within weeks of each other in nearly the same costume. Both publishers were ready to sue. An editor who had worked for the other house talked them out of it.',
 c:[{l:'Send your editor to lunch with theirs',h:'',f(){S.rep+=3;return'They agree it was a coincidence and that there is room for both. Nobody files anything.'}},
    {l:'Sue first',h:'Costs money. Even odds.',f(){S.cash-=5*X();if(Math.random()<.5){mod(1.05,1942,{genre:'hero'});return'They change the costume and pay your costs.'}S.cash-=5*X();return'Their sketches are dated a month before yours. You pay their costs.'}},
    {l:'Change your hero’s costume',h:'',f(){const t=heroTitles()[0],h=t&&S.heroes.find(h=>h.id===t.hero);if(h)h.recog=clamp(h.recog-4,0,100);return'He gets new gloves and a different cape. Readers write in to complain.'}}]},
{y:1939,t:'The fair',x:'Your editor wants to publish a thick comic for the World’s Fair: nearly a hundred pages, cardboard covers, twenty-five cents. Nobody has ever asked a child for a quarter. Since the idea is his, he wants a royalty on every copy.',
 n:'Real history. A 1939 World’s Fair comic of almost 100 pages sold for 25 cents and was a hit. The editor who thought of it had been promised a royalty. It was never paid, and he quit the following year.',
 c:[{l:'Publish it and pay his royalty',h:'A good one-time profit. He stays.',f(){S.cash+=7*X();loyAll(3);S.rep+=2;return'It sells out at the fairgrounds. His check is the largest he has ever seen.'}},
    {l:'Publish it and forget the royalty',h:'More profit.',f(){S.cash+=10*X();S.rep-=4;loyAll(-6);mod(.97,1942);return'It sells out. He asks about the royalty twice, then leaves to start a company of his own.'}},
    {l:'Too rich for children',h:'',f(){return'A rival prints one and sells it for fifteen cents.'}}]},
{y:1940,t:'The last panel',when:()=>heroTitles().length>0,x:'Your writer has invented a laughing villain the whole office is talking about, and killed him off on the last page of his second story. Your editor read the pages this morning and came straight to you.',
 n:'Real history. In 1940 a writer killed off a new villain at the end of his second story. His editor had the last panel redrawn so that the character lived, and he became the best-known villain in comics.',
 c:[{l:'Redraw the last panel',h:'Hero recognition rises.',f(){S.heroes.forEach(h=>h.recog=clamp(h.recog+6,0,100));return'An ambulance is drawn in, with a line saying he will live. He is back in three months.'}},
    {l:'Dead is dead',h:'',f(){S.rep+=1;return'The writer keeps his ending. He thinks of another villain by Friday.'}}]},
{y:1941,t:'The magazine editor',x:'The man you hired to edit your new men’s magazine filled it with famous names. This morning six of those authors and a literary agent say they were never paid. The checks you signed were endorsed in handwriting that is not theirs, and several of the stories were never his to sell.',
 n:'Real history. The first editor of one publisher’s men’s magazine was accused of forging authors’ endorsements on their checks and printing stories without permission. The district attorney cleared the publisher, who paid the valid claims himself.',
 c:[{l:'Pay every writer again',h:'Costs money. Reputation rises.',f(){S.cash-=5*X();S.rep+=5;return'You pay each of them a second time. The editor is said to be in New Orleans.'}},
    {l:'Tell them to sue the editor',h:'',f(){S.rep-=6;loyAll(-5,'W');return'The writers’ magazines print your name beside his for a year.'}}]},
{y:1949,t:'The love glut',x:'Romance comics were the surprise of last year, and every publisher in town has launched a dozen. The racks are full of them and the wholesalers are sending them back unopened. You have a year of finished love stories in the drawer.',
 n:'Real history. The romance boom of 1949 collapsed into a glut. One publisher cancelled 26 romance titles by early 1950 and spent the next two years using up stories already paid for.',
 c:[{l:'Cut back to your best romance title and use up the drawer',h:'Cash from the inventory. Romance stays soft through 1951.',f(){const rs=S.titles.filter(t=>t.genre==='romance').sort((a,b)=>((b.last&&b.last.profit)||0)-((a.last&&a.last.profit)||0));let n=0;rs.slice(1).forEach(t=>{cancelTitle(t,'Cancelled in the romance glut');n++});S.cash+=3*X();mod(.9,1951,{genre:'romance'});return n?cw(n)+' romance title'+(n>1?'s are':' is')+' cancelled. The stories in the drawer fill the survivor for two years.':'You print what is in the drawer and buy nothing new.'}},
    {l:'Hold your titles and wait for the others to quit',h:'Romance sales drop hard for a year, then recover.',f(){mod(.75,1950,{genre:'romance'});mod(1.1,1953,{genre:'romance',from:1951});return'By spring half your rivals are gone and the racks have room again.'}}]},
{y:1934,t:'Someone takes the blame',x:'A grand jury is looking at one of your pulp covers. Your lawyer says somebody has to have approved it. A clerk from the mail room offers to say it was him, if he has a job here for the rest of his life.',
 n:'A story often told. A pulp publisher charged with obscenity in 1934 is said to have let an employee take the blame, and to have kept the man on the payroll for decades. The publisher later denied under oath that he was ever convicted.',
 c:[{l:'Let him say it',h:'The charge goes away. One salary, forever.',f(){S.cash-=2*X();S.rep-=2;S.flags.fallGuy=1;return'He pleads to a misdemeanor and is back at his desk on Monday. He will never be fired.'}},
    {l:'Answer the charge yourself',h:'Lawyers cost money. Even odds on a fine.',f(){S.cash-=4*X();if(Math.random()<.5){S.cash-=4*X();S.rep-=5;return'You are fined, and the newspapers print your name beside the word “obscene.”'}return'The grand jury declines to indict. Your lawyer sends his bill the same day.'}}]},
{y:1936,t:'The partner you didn’t pick',x:'You owe your printer for three issues. He will carry the debt and pay for your next title on one condition. His accountant becomes your partner in the new book.',
 n:'Real history. In late 1936 a printer advanced the money for a founder’s new title on the condition that the printer’s accountant become his partner. Within two years the founder was out of his own company.',
 c:[{l:'Take the money and the partner',h:'Cash now and a new title. He keeps the books.',f(){S.cash+=10*X();S.flags.accPartner=1;if(S.titles.length<titleCap())quickTitle('crime',{qb:4});return'The accountant shakes your hand and asks where you keep the ledgers.'}},
    {l:'Pay the printer what you can',h:'Costs money. Nobody else is in the room.',f(){S.cash-=6*X();S.rep+=2;return'You pay the oldest invoice and promise the rest by spring.'}}]},
{y:1938,t:'The accountant’s ledger',when:()=>S.flags.accPartner===1,x:'Your partner has been through the books. By his count you owe the printer far more than you thought, and the printer is ready to ask a court to put the company into bankruptcy. He will stop it if your titles are signed over to a new company that he controls.',
 n:'Real history. In 1938 a founder’s comics company was forced into bankruptcy on accounting his family still disputes. His partners bought what was left at auction.',
 c:[{l:'Pay his number',h:'Very expensive. You keep everything.',f(){S.cash-=SC(14,.3);S.flags.accPartner=2;return'You pay all of it. He leaves with a check and a letter of reference.'}},
    {l:'Sign the titles over and stay on salary',h:'No cost today. A fifth of your income is his for ten years.',f(){mod(.8,1948);S.rep-=3;S.flags.accPartner=3;return'The new company owns the names. You still run the office, for now.'}},
    {l:'Fight it in court',h:'Costs money. Even odds.',f(){S.cash-=6*X();if(Math.random()<.5){S.flags.accPartner=2;S.rep+=4;return'The judge asks to see the original invoices. The printer cannot find them.'}S.cash-=SC(10,.2);mod(.85,1944);S.flags.accPartner=2;return'The judge takes the accountant’s figures. You keep the company and spend years paying for it.'}}]},
{y:1938,t:'The auction',x:'A rival founder has been pushed into bankruptcy. His titles, his unpublished pages and his mailing permits go to the highest bidder on Thursday morning.',
 n:'Real history. In 1938 the remains of one founder’s comics company were bought at a bankruptcy auction by his former partners.',
 c:[{l:'Bid on the titles',h:'Costs money. Up to two running titles with their readers.',f(){S.cash-=8*X();let n=0;while(n<2&&S.titles.length<titleCap()){quickTitle(n?'humor':'western',{qb:5});n++}return n?'You are the only bidder who brought a certified check. '+cw(n)+' title'+(n>1?'s':'')+' and a crate of finished pages are yours.':'You win the lot, but your schedule is full. The pages go into a closet.'}},
    {l:'Hire his best artist instead',h:'Costs less.',f(){S.cash-=2*X();const a=newTalent('A',RI(66,78));S.staff.push(a);return a.name+' was owed four months’ pay and starts with you on Monday.'}},
    {l:'Stay home',h:'',f(){return'His former partners buy everything for less than the price of a car.'}}]},
{y:1939,t:'The pick-up cards',x:'Your distributor keeps a card for every title showing how many copies each wholesaler took. Another publisher on the same trucks has been reading yours while he checks on his astrology magazine. His first comic book is now at the printer.',
 n:'Real history. At a 1939 trial a publisher’s treasurer testified that a rival could have seen the sales of the first caped hero on the distributor’s pick-up cards while checking on his own magazine.',
 c:[{l:'Have the cards locked away',h:'Costs a little goodwill at the distributor.',f(){S.cash-=1*X();S.rep+=2;return'The cards go into a drawer with a key. The dispatcher stops saying good morning.'}},
    {l:'Start reading everyone else’s',h:'You learn what sells. Better sales for two years.',f(){mod(1.08,1941);S.rep-=3;return'By Friday you know every rival’s numbers. So does anyone who watched you copy them down.'}},
    {l:'Leave it',h:'',f(){mod(.96,1940,{genre:'hero'});return'His first issue looks a great deal like your best seller.'}}]},
{y:1939,t:'Tell him what to say',when:()=>S.flags.copycat&&S.titles.some(t=>t.id===S.flags.copycat),x:'The rival’s lawyers have written about your strongman. If it reaches a courtroom, the young man whose shop drew him will be asked whether you told him to copy theirs. You did. You also owe him for the last three issues.',
 n:'Real history. In a 1939 copyright trial over an imitation of the first caped hero, the packager who drew it testified that the idea was his own. He was reportedly left about $3,000 short by the publisher who hired him. The transcript was found in 2010.',
 c:[{l:'Tell him what to say, and pay him',h:'Costs money. Better odds if it goes to court.',f(){S.cash-=3*X();S.flags.coached=1;return'He will swear the hero was his own idea, years old. He does not look at you on the way out.'}},
    {l:'Tell him what to say, and keep the money',h:'Better odds in court. The shops talk to each other.',f(){S.flags.coached=1;S.rep-=4;loyAll(-6,'A');return'He agrees to say the words. His shop stops taking your calls.'}},
    {l:'Let him tell the truth',h:'',f(){S.rep+=3;return'He will say exactly what happened. Your lawyer closes his folder.'}}]},
{y:1940,t:'The Sunday section',x:'A packager wants to make a sixteen-page comic book that newspapers fold into the Sunday paper. Every paper that takes it is a guaranteed sale. He wants the copyright on the lead feature to come back to him one day.',
 n:'Real history. A newspaper comic-book section launched in 1940 carried the publisher’s copyright notice. Its creator got full ownership only later.',
 c:[{l:'Agree, in writing',h:'Steady income through 1946. Reputation rises.',f(){mod(1.06,1946);S.rep+=5;return'Nineteen newspapers sign in the first month.'}},
    {l:'Agree, and put your own name on the copyright',h:'More income. He will remember.',f(){mod(1.1,1946);S.rep-=3;loyAll(-5,'A');return'Your name runs in small type under his best work.'}},
    {l:'Pass',h:'',f(){return'Another publisher takes the meeting.'}}]},
{y:1940,t:'The cola',x:'A man from New Jersey has a cola nobody has tasted. For a share of your spare cash he will make you half owner, and your comics will carry an ad offering a bottle to any reader who mails in a dime.',
 n:'Real history. Around 1940 a comics publisher put much of his money into a soft drink advertised in his own books as a free giveaway. His bankrupt estate later repaid readers who had mailed in dimes and received nothing.',
 c:[{l:'Buy in and print the ads',h:'Costs money. It could be the next big thing.',f(){S.cash-=6*X();if(Math.random()<.15){S.cash+=20*X();return'Against all sense, a bottler in Ohio buys the formula.'}S.cash-=2*X();S.rep-=4;return'The dimes come in by the sack. There are no bottles to send, and you mail every dime back.'}},
    {l:'Sell him advertising at the full rate',h:'A little cash.',f(){S.cash+=2*X();return'He pays for two issues and is not heard from again.'}},
    {l:'Show him out',h:'',f(){return'He leaves a sample on your desk. Nobody opens it.'}}]},
{y:1942,t:'The printer takes a hero',when:()=>heroTitles().length>0,x:()=>`You are three months behind with the printer. He does not want promises. He wants ${heroTitles()[0].name}, to publish under his own name until the bill is paid.`,
 n:'Real history. In 1942 a printer who was owed money took over a bankrupt publisher’s best-known hero title and published it himself to recover the debt.',
 c:[{l:'Pay the bill',h:'Costs money.',f(){S.cash-=7*X();return'He counts it twice and starts the presses.'}},
    {l:'Hand him the title for two years',h:'No cost. Hero income suffers until 1944.',f(){const t=heroTitles()[0],h=t&&S.heroes.find(h=>h.id===t.hero);if(h)h.recog=clamp(h.recog-8,0,100);mod(.88,1944,{genre:'hero'});return'His company’s name goes in the fine print. The stories get worse.'}},
    {l:'Find another printer',h:'Late books for a year.',f(){mod(.88,1943);S.rep-=2;return'The new plant is in another state and has never met a deadline.'}}]},
{y:1943,t:'The quota',x:'The War Production Board has set your paper for the year at a fraction of what you could sell. Every copy you print sells out. Your circulation man knows three ways to get more paper, and one of them is legal.',
 n:'Real history. In 1943 federal investigators examined one comics packager for using about 250 percent of his quarterly paper quota, and for a hand in 4.5 million copies printed with no quota at all.',
 c:[{l:'Appeal to the board',h:'Slow. Even odds.',f(){if(Math.random()<.5){mod(1.12,1945);return'Two hearings later the board grants an increase.'}return'The appeal is denied after two hearings. You have lost four months.'}},
    {l:'Print through other people’s companies',h:'Much higher sales through 1945. Investigators may come.',f(){mod(1.3,1945);S.flags.paperCheat=1;if(Math.random()<.4){S.cash-=SC(8,.15);S.rep-=6;return'The compliance division counts your copies and finds twice your quota. The fine is large and the newspapers get the story.'}return'Three companies nobody has heard of publish comics that look a great deal like yours.'}},
    {l:'Stay inside the quota',h:'Lower sales through 1945. Reputation rises.',f(){mod(.9,1945);S.rep+=4;return'You cancel nothing and print less of everything.'}}]},
{y:1943,t:'The government’s story',x:'A wartime writers’ board is offering scripts to publishers. A house that prints them may find its paper supply improved. This month’s script asks readers to hate a whole people, down to the children.',
 n:'Real history. A wartime writers’ board fed story ideas to comics publishers, and those who cooperated could get access to extra wood pulp. By 1944 it wanted stories that promoted a race-based war in the Pacific.',
 c:[{l:'Print it as written',h:'More paper through 1945.',f(){mod(1.12,1945);S.rep-=5;S.flags.wwb=1;return'The paper arrives. Years later, this is the issue people bring up.'}},
    {l:'Print their stories, but rewrite this one',h:'A little more paper.',f(){mod(1.05,1945);S.rep+=2;return'Your editor aims the story at a government and leaves the children out. The board accepts it without comment.'}},
    {l:'Decline',h:'No extra paper.',f(){S.rep+=4;return'The board thanks you for your time. Your quota stays where it was.'}}]},
{y:1944,t:'Where the paper goes',x:'You have paper for the pulps or for the comics, and a third idea is on your desk: a magazine for teenage girls that advertisers are asking for. A guidebook publisher down the hall also has paper it isn’t using.',
 n:'Real history. In 1944 one publisher nearly shut down his pulp line to free paper for a teen-girl magazine that was soon printing more than a million copies. Another paid a guidebook firm to publish a giant comic on its paper allotment.',
 c:[{l:'Starve the pulps and launch the magazine',h:'More income through 1948. The pulp writers are let go.',f(){mod(1.15,1948);loyAll(-6,'W');return'The first issue sells out. One western pulp is all that is left of the old line.'}},
    {l:'Rent the guidebook firm’s paper',h:'Costs a fee. One giant comic with every hero you own.',f(){S.cash+=4*X();S.heroes.forEach(h=>h.recog=clamp(h.recog+4,0,100));return'His company’s name is on the cover and your heroes are inside. You pay him for the paper and add a bonus.'}},
    {l:'Keep everything as it is',h:'',f(){mod(.97,1945);return'Every line gets a little less paper than it needs.'}}]},
{y:1945,t:'The delegation',when:()=>heroTitles().length>0,x:'Twelve schoolchildren, Black and white, are in your waiting room with a petition. They speak for a youth group with thousands of members. They want you to retire the servant in your best-selling hero comic, who is drawn and written as a racial caricature. Your editor calls him comic relief.',
 n:'Real history. In 1945 an interracial youth group of about 11,000 students petitioned a comics editor to drop a stereotyped Black character. He retired the character.',
 c:[{l:'Retire the character',h:'Reputation rises.',f(){S.rep+=8;S.flags.delegation=1;return'He is gone by the next issue. One of the children writes to say thank you.'}},
    {l:'Retire him, and ask what they would rather read',h:'Costs a little. Reputation rises more.',f(){S.cash-=1*X();S.rep+=10;S.flags.delegation=1;return'They have brought a list. Your editor reads it twice.'}},
    {l:'Tell them he is only a joke',h:'',f(){S.rep-=10;mod(.96,1947,{genre:'hero'});return'A boy of thirteen tells you it is not a joke to him. A newspaper prints his answer.'}}]},
{y:1945,t:'Buy out the partner',x:'A sister line you bankrolled years ago carries your seal on its covers. The man who runs it is tired of sharing and wants out. He will sell you his half and keep only a book of Bible stories.',
 n:'Real history. In the mid-1940s the founder of a sister comics line sold his share to his partner and kept a single Bible comic. The two lines merged, and he started the company that later became known for horror.',
 c:[{l:'Buy his half',h:'Expensive. Up to two established hero titles join your line.',f(){S.cash-=SC(12,.2);S.flags.sister=1;let n=0;while(n<2&&S.titles.length<titleCap()){quickTitle('hero',{origin:n?'detective':'magician',recog:n?35:40,qb:n?4:6});n++}return n?'His heroes move into your building. He keeps the Bible stories, and nobody thinks to ask what he will publish next.':'You own his heroes now, but your schedule is full. They wait in a drawer.'}},
    {l:'Let him take his heroes and go',h:'A new rival on the hero rack.',f(){mod(.95,1948,{genre:'hero'});return'He takes your seal off his covers and his heroes off your racks.'}}]},
{y:1946,t:'The committee',x:'Your business partner sits on the board of a wartime refugee relief committee. A committee of Congress wants its records and its list of donors. He has refused. A newspaper columnist has called your company a nest of Reds, and two wholesalers have telephoned.',
 n:'Real history. In 1946 the House voted 292 to 56 to cite a crime-comics publisher for contempt over a refugee committee’s records. He was fined $500 with a suspended sentence. He sued a newspaper for $500,000 and later dropped the suit.',
 c:[{l:'Stand by him',h:'Some wholesalers cut their orders for two years. The staff will remember.',f(){mod(.92,1948);loyAll(8);S.rep+=3;return'He is fined five hundred dollars and keeps his desk.'}},
    {l:'Sue the newspaper',h:'Costs money. Long odds.',f(){S.cash-=5*X();if(Math.random()<.3){S.cash+=12*X();S.rep+=5;return'The paper prints a correction and writes a check.'}S.rep-=4;return'The paper’s lawyers file a brief that is worse than the column. You drop the suit.'}},
    {l:'Ask him to resign',h:'The wholesalers calm down.',f(){loyAll(-8);S.rep-=2;return'He clears his office in an afternoon. Nobody at the drawing boards looks up.'}}]},
{y:1947,t:'An expert on the masthead',x:'Parents’ groups are writing to the newspapers about comics. A child-study association will lend you one of its experts as an adviser for fifty dollars a month. Her name inside the front cover would be worth a great deal more than that.',
 n:'Real history. One comics publisher paid a child-study association $50 a month for an adviser’s services. At the 1954 hearings a senator pressed the association about those payments.',
 c:[{l:'Hire her and print her name',h:'Reputation rises. The payments are on the books.',f(){S.cash-=1*X();S.rep+=7;S.flags.expert=1;return'Her first memo asks for fewer guns and better grammar. It goes into a file.'}},
    {l:'Hire her and do what she says',h:'Reputation rises more. Crime sales soften.',f(){S.cash-=1*X();S.rep+=10;S.flags.expert=2;mod(.95,1950,{genre:'crime'});return'Three scripts go back to their writers in the first week.'}},
    {l:'No advisers',h:'',f(){return'You answer the letters yourself.'}}]},
{y:1948,t:'Six rules',x:'Four publishers have formed an association with a six-point code and a seal for the cover. It has no power to enforce anything, and the biggest houses have declined to join. Dues are based on your print run.',
 n:'Real history. In July 1948 a small group of publishers adopted a six-point code. The largest houses stayed out, it could not be enforced, and by 1950 it was all but dead.',
 c:[{l:'Join and use the seal',h:'Costs money. Reputation rises a little.',f(){S.cash-=3*X();S.rep+=4;return'The seal is the size of a postage stamp. Nobody outside the business knows what it means.'}},
    {l:'Stay out with the big houses',h:'',f(){return'You tell the reporters that your comics have always been clean.'}},
    {l:'Write a house code of your own and print it',h:'Reputation rises. Crime sales soften.',f(){S.rep+=6;mod(.95,1950,{genre:'crime'});return'Your code has eleven rules. Your editors can recite four.'}}]},
{y:1950,t:'The press never stops',x:'A printing plant in Connecticut is for sale, presses and all. One of the presses was built to print cereal boxes. Owning it means never paying a printer again. It also means the presses must be fed every day, whether or not you have anything good to print.',
 n:'Real history. One publisher printed its comics in its own plant, on a press first used for cereal boxes. Comics are said to have filled the hours when the presses would otherwise have stood idle.',
 c:[{l:'Buy the plant',h:'Very expensive. Printing is cheaper for twenty-five years. Quality drops.',f(){S.cash-=SC(20,.3);S.flags.plant=1;mod(1.1,1975);S.titles.forEach(t=>t.qb=(t.qb||0)-3);return'The colors are off register and the paper is gray. Each copy costs you a third less.'}},
    {l:'Keep paying the printer',h:'',f(){return'The plant goes to a man who prints song-lyric magazines.'}}]},
{y:1952,t:'A truck of your own',x:'Your national distributor takes its cut and tells you nothing. Your circulation man says you could sign the wholesalers yourself and put your own seal on the covers.',
 n:'Real history. From 1952 to late 1956 one comics publisher ran his own national distribution company.',
 c:[{l:'Start your own distributor',h:'Expensive. More income while you run it.',f(){S.cash-=SC(10,.2);S.flags.truck=1;mod(1.08,1956);return'The wholesalers sign, one territory at a time. Your seal goes on every cover.'}},
    {l:'Stay with the one you have',h:'',f(){return'The statements keep arriving two months late.'}}]},
{y:1953,t:'Glasses included',x:'A small publisher has a sell-out with a comic you read through red and green cardboard glasses, at a quarter a copy. Every publisher in town is rushing one out. A rival says he controls the patent and will sue anyone who prints one.',
 n:'Real history. The first 3-D comic appeared in 1953 and set off a rush that ended in heavy returns within months. One publisher went to court over a 1936 patent, and on September 30, 1953 a judge refused to stop the others.',
 c:[{l:'Rush one out',h:'Costs money. The fad may be over before it ships.',f(){S.cash-=5*X();if(Math.random()<.4){S.cash+=14*X();return'Yours is the third one on the stands and it sells through.'}return'Yours is the eleventh one on the stands. The wholesalers send it back by the bale, glasses and all.'}},
    {l:'License the process and ship one careful issue',h:'Costs more. Small, safe return.',f(){S.cash+=2*X();return'You pay the inventor and print one issue. It earns its keep.'}},
    {l:'Sit this one out',h:'',f(){return'By Christmas the cardboard glasses are in every wastebasket in the country.'}}]},
{y:1954,t:'Fifty dollars a month',when:()=>!!S.flags.expert,x:'At the hearings a senator reads out what your company has paid the child-study association over seven years. He asks why its reports in praise of comics never mentioned the money.',
 n:'Real history. In April 1954 a senator pressed a child-study association about an adviser’s paid work for a comics publisher, which he said its reports had not disclosed.',
 c:[{l:'Show the committee her memos',h:'Works if you listened to her.',f(){if(S.flags.expert===2){S.rep+=5;return'The memos are read into the record. Several are harsher than the senator.'}S.rep-=6;return'The memos are read into the record. So are the stories you printed anyway.'}},
    {l:'Say nothing',h:'',f(){S.rep-=4;return'The newspapers print the dollar figure and nothing else.'}}]},
{y:1956,t:'The cheaper truck',when:()=>S.flags.truck===1,x:'Running your own distributor costs more than you expected. The largest distributor in the country will carry your whole line for less, starting in November. Your circulation man mentions that the big outfit has a government antitrust suit hanging over it.',
 n:'Real history. On November 1, 1956 a publisher closed his own distributor and moved to the largest in the country. It shut down the following year.',
 c:[{l:'Close yours and switch',h:'Cash now.',f(){S.cash+=8*X();S.flags.truck=2;return'You sell the trucks and let the field men go. The wholesalers you dropped will not forget it.'}},
    {l:'Keep your own trucks',h:'No savings.',f(){return'You keep paying the field men.'}}]},
{y:1957,t:'The trucks you kept',when:()=>S.flags.truck===1,x:'The largest newsstand distributor in the country has shut down. Half the publishers in town have no way to reach a newsstand. Your trucks are still running, and three of those publishers are in your waiting room.',
 n:'Real history. When the largest newsstand distributor closed in 1957, the publishers who depended on it were stranded. One of them had shut his own distributor only months before.',
 c:[{l:'Carry them, at a price',h:'Good income through 1962.',f(){mod(1.12,1962);S.rep-=2;return'You set the terms and the number of titles each of them may ship. They sign.'}},
    {l:'Carry them on fair terms',h:'Some income. Reputation rises.',f(){mod(1.06,1962);S.rep+=6;return'They ship what they like and pay the going rate. One of them will remember it for thirty years.'}},
    {l:'Let them find their own way',h:'Fewer rivals on the rack for two years.',f(){mod(1.05,1959);return'Two of the three are out of comics by spring.'}}]},
{y:1970,t:'The barbarian',x:'Your editor wants to license a sword-swinging pulp hero from an author’s estate. The front office agrees on one condition: the license fee comes out of that book’s own budget. That leaves no money for either of the star artists who asked for the job.',
 n:'Real history. Around 1970 a publisher counted a license fee as part of one comic’s production cost, which put its two most eager star artists out of reach. The inexpensive young artist who got the job became a star.',
 c:[{l:'Charge the fee to the book and hire someone cheap',h:'A sword-and-sorcery title at no cost. The new artist may surprise you.',f(){if(S.titles.length>=titleCap())return'You sign the license, but there is no room on the schedule until a title is cancelled.';const a=newTalent('A',RI(54,62));S.staff.push(a);const lucky=Math.random()<.55;if(lucky)a.skill=clamp(a.skill+22,0,99);quickTitle('fantasy',{qb:lucky?8:0});return lucky?a.name+' is twenty-one and draws like nobody else. By the tenth issue the book is your best seller.':a.name+' is twenty-one and learning on the job. The book is fine.'}},
    {l:'Pay the fee from the front office and use your star',h:'Costs money. A strong title.',f(){S.cash-=6*X();if(S.titles.length<titleCap())quickTitle('fantasy',{qb:10});loyAll(4,'A');return'Your best artist gets the book he asked for.'}},
    {l:'Pass on the license',h:'',f(){return'A rival signs the estate within the month.'}}]},
{y:1937,t:'Four colors',x:'You found a printer in New Jersey with a new color process. It has never printed a comic book. The first copies come back muddy, and your editor wants to cancel the title before it embarrasses you.',
 n:'Real history. One publisher’s first comic book was so badly printed that he cancelled it on the spot. Then the newsstand check showed it selling, and he went back to press with a second printing ten times as large.',
 c:[{l:'Wait for the newsstand check',h:'',f(){S.cash+=5*X();S.rep+=2;return'It sold anyway. You order a second printing ten times the size and pay off the printer you already owed.'}},
    {l:'Cancel it',h:'',f(){return'The plates are scrapped. A boy in Ohio writes to ask when the next issue is coming.'}}]},
{y:1938,t:'A penny apiece',x:'Your unsold magazines can be shipped to England as ballast and sold there for a penny each. It is about two hundred thousand copies a month.',
 n:'Real history. One publisher earned a penny apiece on some 200,000 returns a month in England, until the war stopped the ships and froze his money in British banks.',
 c:[{l:'Ship them',h:'Cash now. Anything owed in 1940 will be frozen until the war ends.',f(){S.cash+=3*X();S.flags.frozen=1;return'The first check arrives in pounds.'}},
    {l:'Pulp them here',h:'',f(){return'The returns go to the mill.'}}]},
{y:1939,t:'The percentage',when:()=>S.heroes.length>0&&!!best('W')&&!!best('A'),face:()=>best('A'),x:()=>`${best('W').name} and ${best('A').name} will sell you their new hero for a page rate plus a quarter of the profits. Nothing is written down. Your accountant points out that profit is whatever is left after expenses, and that expenses can be put wherever you like.`,
 n:'Real history. One 1940 hero was sold on a handshake for a page rate plus 25 percent of profits. The publisher charged the whole office’s salaries and expenses to that one comic, and his own accountant told the creators.',
 c:[{l:'Pay the share honestly',h:'Costs money each year you publish their hero. The team stays.',f(){const w=best('W'),a=best('A'),t=heroTitles().find(t=>t.w===w.id||t.a===a.id)||heroTitles()[0];addShare(t?{hid:t.hero}:{hid:topH().id});loyAll(8);S.rep+=3;return'The first statement shows a profit, and a check goes with it.'}},
    {l:'Charge the whole office to their book',h:'No share is ever owed. If they find out, they will look for the door.',f(){if(Math.random()<.55){const w=best('W'),a=best('A');w.loy=clamp(w.loy-35,0,100);a.loy=clamp(a.loy-35,0,100);S.rep-=4;loyAll(-6);return'Your accountant takes them aside at lunch and shows them where the profit went. '+w.name+' and '+a.name+' start having long lunches with a rival publisher.'}S.cash+=3*X();return'“If anyone asks how it is selling,” you tell them, “cry a little.”'}}]},
{y:1943,t:'Dinner and a movie',x:'An outside shop packages half your comics and keeps the best artists on its own payroll. You could take both staffs to a new animated feature and a hotel dinner, and make a few offers over dessert.',
 n:'Real history. In 1942 a publisher took his staff and his packager’s staff to a cartoon feature and dinner, and soon afterward hired away most of the packager’s main artists.',
 c:[{l:'Book the table',h:'Costs money. Two good artists join the staff.',f(){S.cash-=3*X();const a=newTalent('A',RI(60,76)),b=newTalent('A',RI(56,70));S.staff.push(a,b);return a.name+' and '+b.name+' start on Monday. One of them was too hung over to remember agreeing.'}},
    {l:'Keep buying from the shop',h:'',f(){return'The packager sends his usual invoice.'}}]},
{y:1944,t:'Fifteen chapters',when:()=>S.heroes.some(h=>!h.lost),x:()=>`A movie studio wants ${topH().name} for a Saturday serial in fifteen chapters. Its script gives the hero a different name, a different job and a gun.`,
 n:'Real history. A 1944 serial changed a famous comics hero’s name, job and weapon. The studio answered the complaint by saying it had no obligation to change anything, and it was right. The publisher had charged nothing for the rights.',
 c:[{l:'Give them the rights for nothing',h:'Free advertising. No say in what they film.',f(){const h=topH();h.recog=clamp(h.recog+10,0,100);S.fans=clamp(S.fans-2,0,100);return'Children line up on Saturday. The ones who read the comic are confused.'}},
    {l:'Ask for a fee and script approval',h:'They may walk.',f(){if(Math.random()<.5){S.cash+=4*X();topH().recog=clamp(topH().recog+8,0,100);return'They pay, and they keep the costume.'}return'The studio films a radio detective instead.'}}]},
{y:1949,t:'The closet',when:()=>S.staff.length>=4,x:'Your business manager has found a closet full of finished stories that were paid for and never printed. There is enough to fill the line for a year without buying a page.',
 n:'Real history. In 1949 a publisher found a closet of unused inventory and let the whole staff go. They were sent on two weeks of vacation, given two more, and then told not to come back. The editor had to do it while the publisher was in Florida.',
 c:[{l:'Let the staff go and print the closet',h:'Saves a year of page rates. Loyalty and reputation fall.',f(){const out=S.staff.slice().sort((a,b)=>a.skill-b.skill).slice(0,Math.min(3,S.staff.length-2));out.forEach(leave);S.cash+=7*X();loyAll(-12);S.rep-=4;return'You leave for Florida. Your editor does the firing: '+out.map(t=>t.name).join(', ')+'.'}},
    {l:'Use it slowly and keep everyone',h:'',f(){S.cash+=2*X();loyAll(4);return'The closet lasts three years as fill-in material.'}}]},
{y:1950,t:'Make your own competition',x:'Any genre that sells will be copied within months. Your circulation man says the answer is to copy yourself first and fill the rack before a rival can.',
 n:'Real history. One publisher launched more than sixty titles at the start of 1950 and had cancelled thirty-two of them three months later. He said he would rather make his own competition than let rivals do it.',
 c:[{l:'Flood the stands',h:'Free launches up to your limit. They are thin books, and wholesalers notice.',f(){const n=Math.max(0,Math.min(3,titleCap()-S.titles.length)),gs=['western','romance','crime'];let names=[];for(let i=0;i<n;i++)names.push(quickTitle(gs[i],{qb:-5}).name);S.rep-=3;return n?(names.length>1?names.slice(0,-1).join(', ')+' and '+names[names.length-1]:names[0])+' go on sale the same week.':'There is no room on your schedule for another title.'}},
    {l:'Put the money into the books you have',h:'',f(){S.rep+=2;return'The line stays small.'}}]},
{y:1952,t:'A magazine with your name on it',x:'A young man in Chicago is about to launch a men’s magazine. Its title is one word away from a magazine you already publish.',
 n:'Real history. In 1953 a publisher’s cease-and-desist letter forced a new men’s magazine to change its name before the first issue. Under the new name it became far bigger than anything the letter writer ever published.',
 c:[{l:'Send a cease-and-desist letter',h:'',f(){S.flags.tm=1;return'He has no money for a lawsuit. He changes the title and swaps his mascot for a rabbit.'}},
    {l:'Let it go',h:'',f(){return'His first issue sells fifty thousand copies under a name very like yours.'}}]},
{y:1959,t:'Fifteen thousand dollars',when:()=>S.heroes.length>0,x:'Your largest rival, which now also distributes your comics, offers to buy every costumed hero you own. The heroes have not sold in years.',
 n:'Real history. After the 1957 collapse a rival is said to have offered about $15,000 for one publisher’s three wartime heroes. He waved it away, and a colleague called it probably the smartest thing he ever did.',
 c:[{l:'“What is $15,000 going to mean to me?”',h:'',f(){S.rep+=2;return'You keep the names in a drawer.'}},
    {l:'License them reprint rights for five years instead',h:'Cash. Your heroes appear under a rival’s seal.',f(){S.cash+=6*X();S.heroes.forEach(h=>h.recog=clamp(h.recog-5,0,100));return'They pay, and bury the reprints in the back of their own books.'}}]},
{y:1960,t:'A better rack',x:'The chains that run newsstands in train stations and airports will give your magazines the top row for a private payment. The corner candy store would get nothing.',
 n:'Real history. In 1962 the Federal Trade Commission caught several publishers paying big newsstand chains for placement while smaller sellers got nothing. Two men who had started out as partners thirty years earlier signed nearly identical orders.',
 c:[{l:'Pay the chains',h:'Sales rise for two years. It is against a federal law.',f(){S.cash-=2*X();mod(1.08,1961);S.flags.racks=1;return'Your covers move up to eye level.'}},
    {l:'Same terms for every seller',h:'',f(){S.rep+=2;return'You stay on the bottom row at the airport.'}}]},
{y:1962,t:'The consent order',when:()=>S.flags.racks,x:'The Federal Trade Commission has put every one of your companies into one complaint, with your own name on it as the controlling partner. The separate corporations made no difference.',
 n:'Real history. The 1962 order treated one publisher’s many companies as a single enterprise and named him personally, so the penalty for any future violation would land on him.',
 c:[{l:'Sign it',h:'',f(){S.cash-=2*X();S.rep-=3;S.flags.racks=0;return'Any new payment to a chain now costs five thousand dollars an infraction.'}}]},
{y:1967,t:'Two words',x:'A costume maker has paid thirty-five dollars to register the words SUPER HERO for Halloween outfits. Nobody at your company or your rival’s objected.',
 n:'Real history. A costume company registered “Super Hero” in 1967. In 1975 a toy maker facing a Christmas injunction assigned its own claim to the two largest comics publishers jointly, and they have shared the words since.',
 c:[{l:'File an opposition',h:'A legal bill now. It will matter when the toys come.',f(){S.cash-=2*X();S.flags.superhero=1;return'The file is opened. It will stay open for twelve years.'}},
    {l:'It is only costumes',h:'',f(){return'The registration issues in the spring.'}}]},
{y:1965,t:'A couple hundred dollars',when:()=>S.heroes.length>0,x:'A man wants to make television cartoons of your heroes. He offers a few hundred dollars a character. The contract is two pages and you have not read the second.',
 n:'Real history. One publisher let cartoon rights go for a few hundred dollars each in the 1960s, with no say over the result. Ten years later a distributor claimed those papers gave it the cartoons forever and a fifth of all merchandise money.',
 c:[{l:'Take the money',h:'Your heroes are on television this year. The contract will come back.',f(){S.cash+=2*X();S.heroes.forEach(h=>h.recog=clamp(h.recog+8,0,100));S.flags.cheapToon=1;return'The animation barely moves, and children watch every episode.'}},
    {l:'Have a lawyer write a real license',h:'He may not wait.',f(){S.cash-=1*X();if(Math.random()<.5){S.heroes.forEach(h=>h.recog=clamp(h.recog+8,0,100));S.flags.auditClause=1;return'He signs. The rights come back to you in seven years.'}return'He makes cartoons of somebody else’s heroes.'}}]},
{y:1967,t:'One name on the door',when:()=>!S.flags.sold,x:'Your trademark lawyer has a master list of every corporation you own. He suggests filing papers so that all of them legally do business under one name. It would make the company easier to defend, and easier to sell.',
 n:'Real history. In March 1967 nearly three dozen of one publisher’s corporations filed certificates to do business under a single group name. He sold the group the following year.',
 c:[{l:'File the certificates',h:'A small fee. A buyer will pay more.',f(){S.cash-=1*X();S.flags.dba=1;return'Thirty-odd companies now answer to one name.'}},
    {l:'Each company stands on its own',h:'',f(){return'The list goes back in the safe.'}}]},
{y:1969,t:'Play it again',x:'Your war comic’s next issue is finished and inked. It retells a famous wartime movie scene by scene, with every actor’s face and the words of the song. Nobody asked the studio, which belongs to the company that owns your biggest rival.',
 n:'Real history. In 1969 an editor found a finished issue that copied a classic film. He spent a Friday marking up the art, had the faces redrawn and the song renamed, and credited the script to “practically the whole blamed Bullpen.”',
 c:[{l:'Redraw it over the weekend',h:'A small cost. The staff grumbles.',f(){S.cash-=1*X();loyAll(-3);return'The bar moves to another city and the hero loses his cigarette. It ships on time.'}},
    {l:'Print it as it is',h:'It sells. The song’s owners may sue.',f(){if(Math.random()<.5){S.cash-=9*X();S.rep-=3;return'The song’s publishers file first. The studio is second.'}S.fans=clamp(S.fans+4,0,100);return'Nobody at the studio reads comic books.'}}]},
{y:1970,t:'The ice cream parlor',when:()=>S.heroes.some(h=>!h.lost),x:()=>`A family on Long Island has opened ${topH().name} Ice Creams. Your trademark lawyer has a letter ready.`,
 n:'Real history. A 1972 letter told an ice cream shop to drop a hero’s name. It also offered a free poster and permission to paint the hero on the wall, with the copyright notice supplied.',
 c:[{l:'Send the letter, with a poster',h:'',f(){S.rep+=2;S.fans=clamp(S.fans+2,0,100);S.flags.tm=1;return'They change the sign and paint your hero behind the counter, copyright line and all.'}},
    {l:'Sue',h:'',f(){S.cash-=2*X();S.rep-=4;return'The local paper runs a photograph of the family outside the courthouse.'}},
    {l:'It is only ice cream',h:'A name left undefended is harder to defend later.',f(){S.flags.tmWeak=1;return'A second parlor opens in the next town.'}}]},
{y:1971,t:'Twenty cents',x:'Paper is up again. You and your biggest rival have both announced a jump to twenty-five cents for a thicker book. Your circulation man says to do it for one month, then drop to twenty cents for a thinner one, and leave the rival sitting at a quarter.',
 n:'Real history. In 1971 one publisher went to a 25-cent giant for a month and then cut to 20 cents and 32 pages. Its rival stayed at a quarter through the fall, and wholesalers began to favor the cheaper line.',
 c:[{l:'Spring the trap',h:'Sales rise for three years. Other publishers will not forget it.',f(){mod(1.12,1974);S.rep-=2;return'A child with a dollar can buy five of yours or four of theirs.'}},
    {l:'Hold the price you announced',h:'',f(){return'Both lines sit at a quarter and both lose readers.'}}]},
{y:1971,t:'Without the seal',when:()=>S.flags.code&&S.heroes.length>0,x:'A federal health agency has asked you for a story that warns children off drugs. The Code forbids any mention of drugs, and its office will not make an exception.',
 n:'Real history. In 1971 three issues of a popular hero comic ran an anti-drug story without the Code seal. The Code was rewritten soon afterward. Chapter 12.',
 c:[{l:'Publish it without the seal',h:'Some wholesalers will refuse it. The Code may bend.',f(){S.rep+=6;S.fans=clamp(S.fans+5,0,100);mod(.96,1971);return'Teachers and ministers write to thank you. The Code changes its rule, and a rival’s next cover shows a needle.'}},
    {l:'Wait for permission',h:'',f(){return'Permission does not come.'}}]},
{y:1972,t:'Always an employee',when:()=>S.heroes.length>0&&!!best('W'),face:()=>best('W'),x:()=>{const w=best('W'),f=w.g==='F';return`The owners want one face for the company. Their contract for ${w.name} says ${f?'she':'he'} has “always been an employee,” back to ${f?'her':'his'} first day, and gives the company the exclusive right to bill ${f?'her':'him'} as the creator of the whole line. The artists are not mentioned.`},
 n:'Real history. A 1972 publisher’s contract declared its signer an employee retroactively to 1941 and gave the company the right to use his name as author and creator of the line. Press releases after that named him alone.',
 c:[{l:'One name on every book',h:'Fans love a face. Artists lose heart. It helps in court.',f(){S.flags.soleCredit=1;S.fans=clamp(S.fans+6,0,100);loyAll(-10,'A');const w=best('W');w.loy=clamp(w.loy+25,0,100);return w.name+' goes on the college lecture circuit. His name is printed above every title.'}},
    {l:'Credit everyone who was in the room',h:'',f(){loyAll(6);S.rep+=3;S.flags.honest=1;return'The press release takes a second page.'}}]},
{y:1973,t:'Seven tons a week',x:'There is a worldwide paper shortage. Your printer cannot promise stock past the spring.',
 n:'Real history. In the 1973 paper famine a publisher arranged seven tons of paper a week from a printer in Barcelona, and every comics publisher agreed to trim three sixteenths of an inch off the width of the page.',
 c:[{l:'Buy paper abroad at any price',h:'Costs money. Every title ships.',f(){S.cash-=5*X();return'The paper comes from Spain, seven tons at a time.'}},
    {l:'Make the comic narrower',h:'',f(){S.cash-=1*X();S.fans=clamp(S.fans-1,0,100);return'A few collectors notice that the new issues do not line up with the old ones.'}},
    {l:'Skip a month on the weakest books',h:'',f(){mod(.93,1973);return'Half the line goes bimonthly until the mills catch up.'}}]},
{y:1975,t:'In perpetuity',when:()=>S.flags.cheapToon===1,x:'The company that distributes your old cartoons says the two-page contract gave it the shows forever, a veto over any new cartoon, and twenty percent of everything sold with your heroes on it.',
 n:'Real history. A publisher sued in 1975 to undo its 1960s cartoon deals. Two years later a court gave it back the negatives and the rights, and its next distributor paid 32.5 percent of the gross in place of five to ten.',
 c:[{l:'Sue to get the cartoons back',h:'Two years of legal bills. Clean rights afterward.',f(){S.cash-=8*X();S.flags.cheapToon=0;S.flags.auditClause=1;return'The judge voids the contract. You take home the negatives.'}},
    {l:'Pay the twenty percent',h:'License income is lower from now on.',f(){S.flags.cheapToon=2;return'A check goes out every quarter to a man you met once.'}}]},
{y:1976,t:'Comparing notes',x:'Your rival’s publisher has a private suggestion. If the two of you tell each other what every freelancer is paid, nobody can claim a better offer across town to get a raise.',
 n:'Real history. In 1974 two publishers arranged to share freelancers’ rates. One editor-in-chief wrote that the plan was “immoral, unethical, and quite possibly illegal,” and his memo was treated as a resignation. The plan was dropped.',
 c:[{l:'Trade the lists',h:'Page costs fall a little. If it gets out, it gets out.',f(){S.flags.rates=1;if(Math.random()<.5){loyAll(-10);S.rep-=4;return'Your editor calls it immoral, unethical and quite possibly illegal, and resigns the title. Everyone hears why.'}return'The lists change hands at lunch.'}},
    {l:'Refuse',h:'',f(){loyAll(4);S.rep+=2;return'Freelancers go on bluffing, and sometimes it works.'}}]},
{y:1979,t:'Trousers',when:()=>S.titles.some(t=>t.genre==='humor'),x:'The largest cartoon studio in the world says your funny-animal star looks too much like one of theirs. They have sent a model sheet with the changes they require: a different bill, smaller eyes, and a pair of trousers.',
 n:'Real history. In 1977 a cartoon company made a comics publisher redesign a satirical duck and put him in trousers. The two signed an eight-page contract about it in 1980.',
 c:[{l:'Put him in trousers',h:'',f(){S.fans=clamp(S.fans-2,0,100);return'Their artist did the redesign for nothing. Your writer starts plotting stories in which the character is undressed.'}},
    {l:'Fight it',h:'They have more lawyers than you have employees.',f(){if(Math.random()<.25){S.rep+=5;return'A judge decides nobody would confuse the two. You frame the ruling.'}S.cash-=8*X();return'You sign the same contract a year later, after the bills.'}}]},
{y:1979,t:'Hers, before it is theirs',when:()=>S.heroes.some(h=>!h.lost),x:()=>`A television studio that licenses ${topH().name} could invent a female version and own her outright. The only sure way to stop that is to publish one yourself, this month, good or not.`,
 n:'Real history. Several late-1970s heroines were created mainly to hold a trademark before a studio or a rival could. One publisher told a fan petition as much.',
 c:[{l:'Rush her into print',h:'A new hero title at no launch cost. It will not be good.',f(){if(S.titles.length>=titleCap())return'There is no room on the schedule, so she appears for five pages in an anthology. That is enough for the trademark office.';const t=quickTitle('hero',{qb:-4,origin:topH().origin,heroName:nameG(topH().origin,true)});hero(t.hero).fem=1;S.flags.tm=1;return t.name+' is on the stands in six weeks. Four hundred fans sign a petition against her.'}},
    {l:'Wait for a real idea',h:'',f(){if(Math.random()<.35){S.cash-=4*X();return'The studio registers its own heroine in the spring. You pay to license her.'}return'The studio never thinks of it.'}}]},
{y:1980,t:'Saturday morning',when:()=>S.heroes.some(h=>h.recog>=35),x:'A cartoon studio in Los Angeles is for sale. If you owned it, nobody else would decide how your heroes look on television.',
 n:'Real history. A comics publisher bought an animation studio in 1980. Asked why, its publisher said that if people were going to ruin the characters, the company could probably do it as well as anybody else.',
 c:[{l:'Buy the studio',h:'Costs money. License income rises. The network still has the last word.',f(){S.cash-=18*X();S.flags.studio=1;S.heroes.forEach(h=>h.recog=clamp(h.recog+6,0,100));return'The studio’s first job for you is another company’s pink cat. The network adds two sidekicks to your hero over your objection.'}},
    {l:'Keep licensing',h:'',f(){return'A producer replaces one of your heroes with a robot, because another studio holds his option.'}}]},
{y:1981,t:'More returned than sold',when:()=>S.flags.direct,x:'Some comics shops buy your books on no-return terms at the deep discount, then hand them to a newsstand wholesaler and claim credit for them as unsold. A few dealers have returned more copies than they ever bought.',
 n:'Real history. Around 1979 one publisher began printing a diamond around the price on copies sold to comics shops, so they could not be returned through the newsstand system. Collectors feared the marked copies were reprints.',
 c:[{l:'Mark every shop copy',h:'',f(){S.fans=clamp(S.fans-1,0,100);return'A diamond goes around the price. Letters arrive asking whether these are second printings.'}},
    {l:'Trust the dealers',h:'You lose a little money every year through the 1980s.',f(){S.flags.returnsFraud=1;return'The credits keep coming in.'}}]},
{y:1981,t:'The borrowed story',when:()=>!!best('W'),face:()=>best('W'),x:()=>`A famous science-fiction author is on the phone, and he is not calm. Last month’s story by ${best('W').name} is his, scene for scene.`,
 n:'Real history. After a 1983 comic lifted one of his stories, an author settled for a lifetime subscription to everything the publisher printed.',
 c:[{l:'Offer him every comic you publish, for life',h:'',f(){S.cash-=.5*X();return'He accepts. He is the only reader in the country who gets the whole line by settlement.'}},
    {l:'Deny it',h:'',f(){S.cash-=5*X();S.rep-=3;return'He has sued two television networks and won. Your lawyers settle within the month.'}}]},
{y:1983,t:'All the records are here',x:'A children’s comics publisher has gone out of business. Its friendly ghosts and rich little boys could give you the young readers you have lost. The price is fair. Before signing, your editor asks to see the paperwork.',
 n:'Real history. A 1983 purchase of a children’s line died when the buyer’s editor was shown a closet. He said it was a jungle of papers and not one of them proved the seller owned anything. The buyer then launched look-alike characters and was sued by the same company.',
 c:[{l:'Walk away',h:'',f(){return'“They took me to a closet,” your editor says. That is the whole report.'}},
    {l:'Buy it anyway',h:'Costs money. Two children’s titles. Nobody knows who owns what.',f(){S.cash-=12*X();let n=0;while(n<2&&S.titles.length<titleCap()){quickTitle('humor',{qb:4});n++}S.flags.kid=1;if(Math.random()<.5){S.cash-=6*X();return'A cartoonist’s widow produces a contract from 1952. You pay twice for the same ghost.'}return'The closet comes with the deal. Nobody opens it again.'}},
    {l:'Hire their old staff and draw your own',h:'A free children’s title that looks very familiar.',f(){if(S.titles.length<titleCap())quickTitle('humor',{qb:2});S.cash-=5*X();S.rep-=3;return'Their lawyers warn the cereal company that was going to put your characters on its boxes. You cancel the rich little boy after six issues.'}}]},
{y:1984,t:'Twelve issues and a playset',when:()=>S.heroes.length>=2,x:'A toy company wants a line of figures and needs an event to sell them. Every hero you own would fight in one twelve-issue series. Your editor-in-chief says he will write it himself, because no writer on staff will like what happens to their characters.',
 n:'Real history. A 1984 crossover began as a toy deal and sold more than a million copies an issue. The editor-in-chief wrote all twelve issues, and a leaked memo had him asking editors to praise it in their letters pages. Chapter 23.',
 c:[{l:'Do it',h:'Sales and licensing jump for two years. Your writers resent it.',f(){mod(1.15,1985);S.cash+=6*X();loyAll(-8,'W');S.heroes.forEach(h=>h.recog=clamp(h.recog+5,0,100));return'One hero comes home in a black costume. The memo telling editors to “legitimize the hell out of it” reaches the fan press a year later.'}},
    {l:'Stories first, toys second',h:'',f(){loyAll(5,'W');return'The toy company goes to your rival.'}}]},
{y:1984,t:'The wrestler',when:()=>S.heroes.some(h=>!h.lost),x:()=>`The most popular wrestler in the country has been calling himself by half of ${topH().name}’s name. His promoter does not want a fight.`,
 n:'Real history. In 1984 a wrestler and his promoter signed his ring name over to a comics publisher and licensed it back for twenty years. The contract said which colors his logo could not use and that the borrowed word could never be printed larger than his own name.',
 c:[{l:'Take the name and license it back',h:'A small royalty for twenty years.',f(){S.flags.wrestler=1;S.flags.tm=1;return'His shirts now carry a line of small type with your company’s name in it.'}},
    {l:'Leave him alone',h:'',f(){S.flags.tmWeak=1;return'The crowd chants the name every Saturday night.'}}]},
{y:1985,t:'Three covers in a row',when:()=>S.heroes.some(h=>!h.lost),x:()=>`A self-published humor comic has dressed its running-gag character as ${topH().name} on three straight covers. Each one sold better than the last. Your lawyers say that a parody is allowed once, and that a trademark nobody defends gets weaker.`,
 n:'Real history. In 1983 a publisher objected when an independent comic put a spoof of its most popular hero on three consecutive covers. The matter was closed by licensing the parody after the fact for one dollar.',
 c:[{l:'License it to him for a dollar',h:'',f(){S.rep+=3;S.flags.tm=1;return'The trademark is protected and nobody is sued. He goes on ranting about you in his letters page, because the readers enjoy it.'}},
    {l:'Cease and desist',h:'',f(){S.fans=clamp(S.fans-4,0,100);S.rep-=2;return'He stops. He also prints your letter.'}},
    {l:'It is a joke. Leave it.',h:'',f(){S.flags.tmWeak=1;return'A button goes on sale at conventions: “I eat your heroes for breakfast.”'}}]},
{y:1987,t:'Pay my people',when:()=>S.flags.sold,x:()=>`${S.lead.owner} is preparing to sell. To make the year look better, the front office has stopped paying freelancers their foreign royalties and has cut the health plan. Your editor-in-chief is in the doorway.`,
 n:'Real history. An editor-in-chief said that before a 1986 sale the company held back royalties and benefits to inflate its results. He wrote to the new owners telling them where the bodies were buried, and was fired within months.',
 c:[{l:'Pay what is owed',h:'Costs money. The bullpen remembers.',f(){S.cash-=6*X();loyAll(10);S.rep+=3;return'The checks go out with an apology.'}},
    {l:'Keep the numbers pretty',h:'Cash now. Somebody will write a letter.',f(){S.cash+=5*X();loyAll(-12);S.rep-=4;S.flags.bodies=1;return'Your editor-in-chief writes to the buyers and tells them how the profit was made. He is fired, and a freelancer burns him in effigy at a party anyway.'}}]},
{y:1990,t:'The club',x:'Your new heroine shares her name with a motorcycle club. The club turns out to be a corporation with a trademark lawyer. Three members in leathers are waiting for your general counsel in a mediation room.',
 n:'Real history. A motorcycle club sued a comics publisher in 1992 over a heroine’s name. The publisher argued the public already viewed the club with distaste, and lost that motion. It was settled in one afternoon with a new title and a $35,000 gift to a children’s charity.',
 c:[{l:'Rename her and give to a children’s charity',h:'',f(){S.cash-=1*X();S.rep+=3;return'Law schools will teach the afternoon as a model settlement. The new name belongs to a tiny publisher’s comic, and its owner calls a lawyer too.'}},
    {l:'Argue that their name has no goodwill to harm',h:'',f(){S.cash-=5*X();S.rep-=2;return'The judge denies your motion. One of the bikers asks the mediator why he has to sit there. “Because I order you to.”'}}]},
{y:1990,t:'Every pallet',x:'An editor you fired has started his own company. His first title is one syllable away from a name your British office announced and never shipped. He is about to print 700,000 copies and has a toy deal waiting.',
 n:'Real history. In 1993 a publisher sued a former editor-in-chief’s new company over a title. A judge held that publicity alone could establish a trademark, then found no confusion. The defense cost the small company a third of its cash and a toy license, and it closed within a year.',
 c:[{l:'Get a restraining order at the printer',h:'It will cost him more than it costs you.',f(){S.cash-=3*X();S.rep-=5;loyAll(-4);return'The printer explains that his comics are stacked on every pallet that carries yours. To stop his is to stop your own. You withdraw. The judge tells you never to use his court as a business weapon again. The small company runs out of money anyway.'}},
    {l:'Leave him alone for a year',h:'',f(){S.rep+=3;return'His book ships. Yours never does.'}}]},
{y:1994,t:'Five editors-in-chief',when:()=>S.flags.public||S.flags.sold,x:'The business side is tired of an editor-in-chief who says no. The plan is to promote him sideways and split the line into five groups, each with its own chief and its own sales target.',
 n:'Real history. In 1994 a publisher replaced one editor-in-chief with five. The only one who hit his growth target did it by stretching a single storyline for years, and he was laid off in 1996 with more than forty percent of the editorial staff.',
 c:[{l:'Split the line',h:'Sales rise for a year. Stories stop ending.',f(){mod(1.06,1994);mod(.93,1997);loyAll(-10);S.flags.fiveEIC=1;return'The old chief keeps his office so the company looks stable. One group stretches a single storyline for two years because it keeps selling.'}},
    {l:'Keep one editor between the staff and the owners',h:'',f(){loyAll(6);S.rep+=2;return'He goes on saying no.'}}]},
{y:1994,t:'Straight to the reader',when:()=>S.flags.direct,x:'A mail-order catalogue bound into your own comics could sell collections and merchandise directly to readers at a discount. The comics shops would be selling against their own supplier.',
 n:'Real history. A 1994 catalogue bound into comics sold direct to readers. Shop owners said it offered items they had been told they could not sell. A distributor who complained on their behalf was cut off.',
 c:[{l:'Print the catalogue',h:'Cash. The shops order less for two years.',f(){S.cash+=8*X();mod(.93,1995);S.fans=clamp(S.fans-3,0,100);return'In the catalogue’s comic strip your hero says that shopping in stores is too dangerous. A distributor’s newsletter is headed MAD AS HELL.'}},
    {l:'Leave retail to the shops',h:'',f(){S.rep+=2;return'The idea stays in a drawer.'}}]},
{y:1997,t:'The negative',when:()=>S.flags.film||S.heroes.some(h=>h.recog>=50),x:'A producer who optioned one of your teams years ago has made the film for almost nothing, only to keep his rights from lapsing. It is finished, and it looks like what it cost.',
 n:'Real history. In the early 1990s a film of a famous quartet was made for about $1.4 million to hold an option. The publisher’s film chief paid to take the negative and it was never released.',
 c:[{l:'Buy the negative and bury it',h:'Costs money.',f(){S.cash-=5*X();return'The cast learns from a trade paper that there will be no premiere.'}},
    {l:'Let it open',h:'',f(){S.heroes.forEach(h=>h.recog=clamp(h.recog-6,0,100));S.fans=clamp(S.fans-3,0,100);return'Bootleg tapes are sold at conventions for years.'}}]},
{y:1998,t:'You have been overpaid',when:()=>S.flags.debt||S.flags.public,x:'The accountants have gone back ten years and found small overpayments to freelancers, from fifty dollars to four thousand. A form letter is ready. Those who do not pay will be sent to a collection agency.',
 n:'Real history. After a 1998 reorganization a publisher mailed overpayment notices to freelancers going back almost a decade, and a litigation trust sued others for money they had been paid during the bankruptcy. One writer posted his $53 bill online.',
 c:[{l:'Mail the letters',h:'A little cash. A great deal of anger.',f(){S.cash+=2*X();loyAll(-15);S.rep-=6;S.flags.overpaid=1;return'A writer who once sued you posts his bill for fifty-three dollars under the heading “The High Cost of Working for Comics.”'}},
    {l:'Tear them up',h:'',f(){loyAll(5);S.rep+=2;return'The accountants are told to find the money somewhere else.'}}]},
{y:1999,t:'He may carry it',when:()=>S.heroes.some(h=>!h.lost),x:()=>`An artist who left you has licensed an old patriotic hero from its creator and given him a round shield. It looks a great deal like the one ${topH().name} would carry if he carried one. His first issue is at the printer.`,
 n:'Real history. In 1997 a court let a rival patriotic hero keep his shield, his star and his colors, on the condition that he never throw the shield. The writer said the hero would fire missiles out of it instead.',
 c:[{l:'Go to court the night before he prints',h:'',f(){S.cash-=3*X();return'His lawyers show up, which yours did not expect. The judge lets the hero carry the shield and block with it. He may not throw it.'}},
    {l:'Let the readers decide',h:'',f(){S.rep+=2;return'Both heroes are on the rack in the same week.'}}]},

{y:1940,t:'Two pages of text',x:'The Post Office will not carry a comic book at the cheap magazine rate unless it has at least two pages of plain text in it. Nobody reads them. Somebody has to write them.',
 n:'Real history. Early comics carried two-page text stories to qualify for the cheaper mailing rate, and the newest writer in the office usually got the job.',
 c:[{l:'Give the job to the newest writer',h:'Overhead falls a little for good.',f(){S.flags.text=1;const w=S.staff.filter(t=>t.role==='W').sort((a,b)=>b.hired-a.hired)[0];if(w){w.skill=clamp(w.skill+2,0,96);return w.name+' writes a two-page thriller every week and gets better at it.'}return'The publisher writes them at lunch.'}},
    {l:'Pay the full postage',h:'',f(){return'You pay the higher rate.'}}]},
{y:1942,t:'The franchise tax',when:()=>!S.flags.sold,x:'The state’s franchise tax and its paperwork are heavy for a business that is really one desk. Your lawyer suggests dissolving the corporation and reopening the next morning as a two-person partnership with your wife. The profits would be taxed once, on your own return.',
 n:'Real history. One publisher dissolved his main corporation in 1942 and reopened it as a husband-and-wife partnership with pass-through taxes.',
 c:[{l:'Reopen as a partnership',h:'Your tax rate falls three points until the company is sold.',f(){S.flags.partner=1;return'The new letterhead arrives on Tuesday.'}},
    {l:'Stay a corporation',h:'',f(){return'You keep the seal and the minute book.'}}]},
{y:1942,t:'Old stories, new covers',when:()=>S.titles.some(t=>t.reprint),x:'You own a file drawer of stories that ran years ago. With a new title and a new cover, nobody at the newsstand would know. The word “reprint” appears nowhere.',
 n:'Real history. In 1942 the Federal Trade Commission ordered two pulp publishers to stop selling reprinted stories as new, and it came back in 1946 with the same complaint against twelve of one publisher’s companies.',
 c:[{l:'Sell them as new',h:'Reprint and shop titles sell more through 1946.',f(){S.flags.fakeNew=1;return'The drawer empties out.'}},
    {l:'Label the reprints',h:'',f(){S.rep+=2;return'A small line goes on the contents page.'}}]},
{y:1946,t:'The Commission returns',when:()=>S.flags.fakeNew,x:'The Federal Trade Commission has filed a complaint naming every one of your publishing companies. It says old stories were sold as new and abridged ones as complete.',
 n:'Real history. In 1946 the Federal Trade Commission came back with the same complaint it had made in 1942, this time against twelve of one publisher’s companies, for selling reprints as new stories and abridged stories as complete.',
 c:[{l:'Sign the order and pay',h:'',f(){S.cash-=4*X();S.rep-=5;S.flags.fakeNew=0;return'Every reprint now says so, in small type.'}}]},
{y:1955,t:'Same numbers, new name',when:()=>S.flags.code&&S.dead.some(d=>/Code/.test(d.why||'')),x:'A cancelled crime comic still has a mailing permit and fifty-two issues of numbering. Your editor suggests bringing it back as a law-and-order book where justice always wins. It would pick up at issue fifty-three.',
 n:'Real history. In 1955 a crime comic resurfaced under a new title with the old numbering and a cover line promising that justice always wins.',
 c:[{l:'Bring it back',h:'A crime title at no launch cost, safe under the Code.',f(){const t=quickTitle('crime',{qb:3});t.start=S.year-5;return t.name+' starts with issue fifty-three.'}},
    {l:'Let it rest',h:'',f(){return'The permit lapses.'}}]},
{y:1957,t:'First in line',when:()=>S.flags.truck!==1,x:'Your distributor is in trouble and everybody knows it. Your lawyer has an idea. If one of your own companies is owed the most money when the distributor fails, your company is first in line for whatever is left.',
 n:'Real history. When one magazine distributor slid into bankruptcy in the 1930s, a publisher had already made his own company one of its largest creditors.',
 c:[{l:'Run up the invoices',h:'Cash when the distributor fails. Other publishers will know what you did.',f(){S.cash+=8*X();S.rep-=2;S.flags.creditor=1;return'Your claim is the first one read out in court.'}},
    {l:'Take your losses like everyone else',h:'',f(){return'You file your claim with the rest.'}}]},
{y:1958,t:'By the ton',x:'A man in a loud suit offers to buy your unsold returns by the ton, with the covers already torn off. He will staple new covers on them and sell them three for a quarter in bargain stores.',
 n:'Real history. One operator bought warehouses of coverless returns in the late 1950s, paid moonlighting artists for new covers and sold the comics in cellophane bags.',
 c:[{l:'Sell him the returns',h:'A little cash. Your old stories turn up under strange names.',f(){S.cash+=3*X();S.rep-=2;return'A truck backs up to the warehouse.'}},
    {l:'Pulp them',h:'',f(){return'The returns go to the paper mill.'}}]},
{y:1959,t:'The commissioners',x:'One of your men’s adventure magazines ran a story about a city in the South. Three of its commissioners are suing for libel. Their lawyers want to know why so many corporations share one two-room suite and one secretary.',
 n:'Real history. Three city officials sued a New York magazine company for libel in 1957, and the case tested how much protection a publisher’s layers of shell corporations really gave.',
 c:[{l:'Settle',h:'Shell corporations make it cheaper.',f(){const c=6*X()*(1-.15*S.shells);S.cash-=c;return'You pay '+money(c)+' and print a correction.'}},
    {l:'Fight it down there',h:'A home-town jury for the other side.',f(){if(Math.random()<.4){S.rep+=3;return'The case is thrown out on jurisdiction. The corporation that published the story has no office in that state.'}S.cash-=12*X()*(1-.15*S.shells);S.rep-=4;return'The jury takes forty minutes.'}}]},
{y:1966,t:'The renewal',when:()=>S.heroes.length>0&&!!best('A'),face:()=>best('A'),x:()=>{const h=S.heroes[0];return`The first copyright term on ${h.name} is running out. A former partner has sued to take the renewal. He says he created the hero alone and never signed anything. ${best('A').name} was there, and has a mortgage that depends on your checks.`},
 n:'Real history. In 1966 a Golden Age creator sued for the renewal copyright on a famous hero. The publisher persuaded a star artist who relied on its work to give an affidavit, and the affidavit undercut the claim.',
 c:[{l:'Ask your artist for an affidavit',h:'You will win. The artist will not forget being asked.',f(){const a=best('A');a.loy=clamp(a.loy-18,0,100);S.flags.affidavit=1;S.flags.paper=1;return a.name+' signs. The claim collapses, and the two old partners stop speaking.'}},
    {l:'Buy a signed assignment from the partner',h:'Costs money. The paperwork is clean from now on.',f(){S.cash-=10*X();S.flags.paper=1;S.rep+=3;return'He signs, and for once it is all in writing.'}},
    {l:'Fight without the affidavit',h:'Less than even odds.',f(){if(Math.random()<.45){S.flags.paper=1;return'The judge finds he was an employee. You keep the hero.'}const h=S.heroes[0],t=S.titles.find(t=>t.hero===h.id);if(t)cancelTitle(t,'Lost at renewal');S.heroes=S.heroes.filter(x=>x!==h);return'You lose. '+h.name+' goes home with the man who drew him first.'}}]},
{y:1969,t:'A new company in Delaware',when:()=>S.flags.sold,x:()=>`${S.lead.owner} has formed a new subsidiary in Delaware and moved every copyright into it. The renewal forms now list your old writers and artists as “employees for hire” of corporations that no longer exist. Nobody asked them to sign.`,
 n:'Real history. After a 1968 sale the buyer set up a Delaware subsidiary, transferred the copyrights there and renewed them with the creators tagged as employees for hire of the old shell companies.',
 c:[{l:'Let the lawyers handle it',h:'Stronger in court. The bullpen hears about it.',f(){S.flags.wfh=1;loyAll(-8);return'The forms are filed.'}},
    {l:'Get real signatures and pay for them',h:'Costs money. Stronger in court and fair.',f(){S.cash-=8*X();S.flags.paper=1;loyAll(6);S.rep+=3;return'Each creator gets a check and a copy of what was signed.'}}]},
{y:1977,t:'The audit clause',when:()=>S.heroes.some(h=>h.recog>=40),x:'A studio wants television rights to your heroes. Your agent spends a month on the contract. He wants a clause that lets you audit the studio’s books, so your share is not lost among its other projects.',
 n:'Real history. In 1977 an agent locked an audit clause into a television deal so that a publisher’s royalties would not be swallowed by the studio’s other projects.',
 c:[{l:'Pay for the long contract',h:'A small cost. License income rises for good.',f(){S.cash-=2*X();S.flags.auditClause=1;return'The clause is on page nineteen.'}},
    {l:'A handshake is enough',h:'',f(){S.flags.handshake=1;return'The first royalty statement shows the series losing money.'}}]},
{y:1978,t:'One page',x:'A new copyright law lets creators take back work they sold after a waiting period, unless it was made for hire. Your lawyers have a one-page form saying the company is the legal author of everything. Some of the writers are talking about forming a guild.',
 n:'Real history. In 1978 one publisher required every freelancer to sign a one-page work-for-hire form, and an informal writers’ union effort that year lost the negotiation.',
 c:[{l:'No signature, no check',h:'Strong in court. Loyalty and reputation fall.',f(){S.flags.wfh=1;loyAll(-12);S.rep-=3;return'A cartoonist tells a roundtable that when you sign that check you have given away everything.'}},
    {l:'The form, with promises in writing',h:'Costs money. Insurance, reprint fees and art returns are guaranteed.',f(){S.flags.wfh=1;S.cash-=5*X();S.flags.artReturn=1;S.flags.benefits=1;loyAll(4);return'The cover letter ends, “Please feel free to consult a lawyer.”'}},
    {l:'Recognize the writers’ guild',h:'No form. Page rates go to generous. The bullpen is yours.',f(){S.rate=2;loyAll(15);S.rep+=5;S.flags.guild=1;return'The first meeting is held in your conference room.'}}]},
{y:1992,t:'Cards and stickers',when:()=>S.flags.gimmick||S.flags.public,x:'Trading cards are selling faster than the comics. A card company is for sale and the bankers say it will pay for itself in two years.',
 n:'Real history. One publisher bought into trading cards at the top of the market and took a forty-million-dollar write-off on unsold cards in 1995.',
 c:[{l:'Buy the card company',h:'Costs money. Strong income through 1994.',f(){S.cash-=20*X();S.flags.cards=1;return'The first set ships with a hologram.'}},
    {l:'Stay in comics',h:'',f(){return'You pass.'}}]},
{y:1993,t:'Holdings One, Two and Three',when:()=>S.lead.owner==='Brandt & Voss Holdings',x:'The financier has set up three Delaware shells. Each one holds a block of your company’s stock, pledges it as collateral and sells junk bonds against it. The money goes upstream to his holding company as dividends. None of it goes into comics.',
 n:'Real history. In 1993 and 1994 three Delaware holding shells pledged a publisher’s stock for junk bonds with a face value near nine hundred million dollars, and most of the dividends went to the owner’s holding company. A trust later sued the former directors over them.',
 c:[{l:'Put your objection in writing',h:'Reputation rises. The publisher may be replaced.',f(){S.rep+=5;S.flags.objected=1;if(Math.random()<.4){const p=mkExec('suit');p.hired=S.year;S.lead.pub=p;logLead(p.name+' is installed as publisher.');return'The memo is answered in a week. '+p.name+' has your publisher’s office.'}return'The memo is filed. It will matter to a judge one day.'}},
    {l:'Keep the presses running',h:'',f(){return'The bonds sell out in an afternoon.'}}]},
{y:1995,t:'A distributor of your own',when:()=>S.flags.direct,x:'A dozen distributors carry comics to the shops. Your owners want to buy one and sell your books through it alone. Every other distributor would lose its biggest line overnight.',
 n:'Real history. One publisher bought its own distributor in the mid-1990s. The second-largest distributor sued the same day, and within two years a single company was left carrying everyone else.',
 c:[{l:'Buy it',h:'Costs money. Shops struggle to get your books for three years.',f(){S.cash-=15*X();mod(.85,1997);S.rep-=5;S.flags.ownDist=1;return'A rival distributor files suit three hours after the announcement.'}},
    {l:'Leave the system alone',h:'',f(){S.rep+=2;return'The shops keep ordering the way they always have.'}}]},
{y:1996,t:'Dolls or toys?',when:()=>S.heroes.some(h=>h.deals.some(d=>d.k==='toys'))||S.flags.film||S.lead.owner==='Kessler Toy Works',x:'Customs charges twelve percent on imported dolls, which represent human beings, and about half that on toys that represent creatures. Your lawyers propose telling a federal court that your heroes are not human.',
 n:'Real history. A toy company fought Customs through the late 1990s over some ninety imported action figures, arguing that the heroes were non-human creatures and owed the lower duty.',
 c:[{l:'Argue that they are not human',h:'Saves money. The fans will read the filing.',f(){S.cash+=5*X();S.fans=clamp(S.fans-6,0,100);S.flags.nonhuman=1;return'The court agrees, figure by figure. Fans point out that the comics have said the opposite for thirty years.'}},
    {l:'Pay the doll rate',h:'',f(){S.rep+=2;return'Your heroes stay human, at twelve percent.'}}]},

{y:1989,t:'A kid with a fanzine',when:()=>!!topHT(),x:()=>`Scooter Flintlock works the counter at a comics shop and publishes a fanzine. He wants to know who really created ${hero(topHT().hero).name}. He has already talked to a retired artist, a letterer and a former secretary. Now he is in your lobby asking to see the files.`,
 n:'Real history. From the 1960s on, fans with tape recorders interviewed retired artists, letterers and editors, and many questions about who created what were first raised in fanzines.',
 c:[{l:'Open the files',h:'Reputation rises a little. He will write what he finds.',f(){S.flags.zine='open';S.rep+=3;return'He spends three days in the file room with a notebook.'}},
    {l:'“No unsolicited visitors”',h:'',f(){S.flags.zine='shut';return'The guard walks him out. He keeps digging.'}}]},
{y:1995,t:'The convention panel',when:()=>S.flags.zine,x:()=>{const fair=S.flags.zine==='open'&&S.credits&&!S.flags.firedCreators;return fair?`Scooter Flintlock’s history of ${S.co} is the talk of the convention. It names every writer and artist who built your heroes, and it says the company did right by them. He asks your veterans to sign copies.`:`Your publisher is on stage at the big convention when Scooter Flintlock takes the microphone. He has the interviews, the dates and the pages. He tells two thousand fans who drew what, and who took the credit.`},
 n:'Real history. Credit disputes have been argued in public on convention panels, sometimes with the old creators sitting in the audience.',
